<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<body>
<title>The Close Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Kalam:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@400;600;900&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: a newspaper reading page. Article column + proof-reader's margin rail.
   Keywords and answers are marked in blue editor's pencil; wrong picks are corrected in red. */
:root{
  --paper:#edf0ea; --sheet:#f8f9f6; --paper-2:#e1e5de;
  --ink:#14181b; --ink-2:#434d55; --ink-3:#77828a; --rule:#bfc6be;
  --pencil:#2340b0; --pencil-wash:rgba(35,64,176,.09); --marker:rgba(236,190,52,.42);
  --red:#b3302a; --red-wash:rgba(179,48,42,.08); --ok:#1d7548; --ok-wash:rgba(29,117,72,.10);
  --pos-n:#1d6b74; --pos-v:#86338c; --pos-adj:#8f6208; --pos-adv:#3d5c9e; --pos-f:#77828a;
  --shadow:0 -10px 30px rgba(20,24,27,.14);
  --st1:rgba(226,112,58,.20); --st1-ink:#b04f26; --st2:rgba(214,166,36,.22); --st2-ink:#856010;
  --pop-shadow:0 18px 50px rgba(20,24,27,.22),0 2px 6px rgba(20,24,27,.10);
  --sb:rgba(20,24,27,.16); --sb-hover:rgba(20,24,27,.34); --sb-active:rgba(35,64,176,.55);
  --f-mast:"UnifrakturMaguntia","Old Standard TT",Georgia,serif;
  --f-head:"Old Standard TT","Noto Serif SC",Georgia,serif;
  --f-body:"Newsreader",Georgia,"Noto Serif SC","Songti SC",serif;
  --f-zh:"Noto Serif SC","Songti SC","STSong",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-hand:"Kalam","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151a; --sheet:#171c22; --paper-2:#1f262d;
    --ink:#e4e7e1; --ink-2:#a9b1b6; --ink-3:#7f8a91; --rule:#2e373f;
    --pencil:#93abff; --pencil-wash:rgba(147,171,255,.13); --marker:rgba(236,190,52,.30);
    --red:#ff8476; --red-wash:rgba(255,132,118,.12); --ok:#62d29a; --ok-wash:rgba(98,210,154,.12);
    --pos-n:#6fc7cf; --pos-v:#d99ee2; --pos-adj:#e2b65c; --pos-adv:#a6bbef; --pos-f:#7f8a91;
    --shadow:0 -10px 30px rgba(0,0,0,.5);
    --st1:rgba(255,140,90,.22); --st1-ink:#ff9f73; --st2:rgba(240,196,80,.20); --st2-ink:#e9c46a;
    --pop-shadow:0 18px 50px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.45);
    --sb:rgba(228,231,225,.16); --sb-hover:rgba(228,231,225,.34); --sb-active:rgba(147,171,255,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151a; --sheet:#171c22; --paper-2:#1f262d;
  --ink:#e4e7e1; --ink-2:#a9b1b6; --ink-3:#7f8a91; --rule:#2e373f;
  --pencil:#93abff; --pencil-wash:rgba(147,171,255,.13); --marker:rgba(236,190,52,.30);
  --red:#ff8476; --red-wash:rgba(255,132,118,.12); --ok:#62d29a; --ok-wash:rgba(98,210,154,.12);
  --pos-n:#6fc7cf; --pos-v:#d99ee2; --pos-adj:#e2b65c; --pos-adv:#a6bbef; --pos-f:#7f8a91;
  --shadow:0 -10px 30px rgba(0,0,0,.5);
  --sb:rgba(228,231,225,.16); --sb-hover:rgba(228,231,225,.34); --sb-active:rgba(147,171,255,.6);
  --st1:rgba(255,140,90,.22); --st1-ink:#ff9f73; --st2:rgba(240,196,80,.20); --st2-ink:#e9c46a;
  --pop-shadow:0 18px 50px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:10px 56px}

/* ---------- masthead ---------- */
.mast-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-block:6px;border-bottom:1px solid var(--rule)}
.mast-name{font-family:var(--f-mast);font-weight:400;font-size:clamp(2.5rem,8.5vw,5.4rem);line-height:1;text-align:center;margin:.18em 0 .05em;letter-spacing:.01em}
.mast-sub{text-align:center;font:600 13px/1.6 var(--f-zh);letter-spacing:.45em;color:var(--ink-2);margin-bottom:10px;padding-left:.45em}
.tabs{display:flex;justify-content:safe center;gap:2px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 14px;font:500 14px/1.2 var(--f-zh);color:var(--ink-2);cursor:pointer;white-space:nowrap;position:relative}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:var(--pencil);border-radius:2px}
.tab .ct{font:500 11px var(--f-mono);color:var(--pencil);margin-left:4px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;margin-top:28px}
@media (min-width:1040px){.layout.has-rail{grid-template-columns:minmax(0,1fr) 340px}}
.view{min-width:0}
.story{max-width:43rem;margin-inline:auto}
.kicker{font:600 11px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--pencil)}
.headline{font:700 clamp(2rem,5.2vw,3.15rem)/1.08 var(--f-head);text-wrap:balance;margin:.22em 0 .2em;letter-spacing:-.005em}
.headline.sm{font-size:clamp(1.7rem,4vw,2.4rem)}
.dek{font:400 1.05rem/1.7 var(--f-zh);color:var(--ink-2);margin:0 0 14px}
.byline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font:500 12px/1.5 var(--f-mono);color:var(--ink-3);border-block:1px solid var(--rule);padding-block:8px;font-variant-numeric:tabular-nums}
.byline b{color:var(--ink);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 26px}
.tbtn{font:500 13px/1.2 var(--f-zh);padding:7px 11px;border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.tbtn:hover{border-color:var(--ink-2);color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tbtn.warn{border-color:var(--red);color:var(--red)}

/* ---------- article body ---------- */
.para{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:0 14px;margin-bottom:1.35em}
.gut{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-top:.45em}
.pnum{font:500 11px var(--f-mono);color:var(--ink-3)}
.ptr{font:500 12px/1 var(--f-zh);color:var(--pencil);border:1px solid currentColor;background:none;padding:4px 6px;border-radius:3px;cursor:pointer}
.ptr[aria-pressed="true"]{background:var(--pencil);color:var(--sheet)}
.ptext{font-size:1.17rem;line-height:1.88;margin:0;min-width:0;overflow-wrap:break-word}
.para:first-child .ptext::first-letter{font-family:var(--f-head);font-weight:700;font-size:3.7em;float:left;line-height:.8;padding:.07em .09em 0 0}
.para-zh{grid-column:2;font:400 .98rem/1.95 var(--f-zh);color:var(--ink-2);border-left:2px solid var(--pencil);padding:.55em 0 .55em 1em;margin-top:.5em;background:linear-gradient(90deg,var(--pencil-wash),transparent 75%)}
@media (max-width:620px){
  .para{grid-template-columns:minmax(0,1fr)}
  .gut{flex-direction:row;align-items:center;padding:0;margin-bottom:4px}
  .para-zh{grid-column:1}
  .ptext{font-size:1.1rem}
}
.s{border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .2s}
.s.on{background:var(--pencil-wash)}
.s.flash{animation:flash 2.6s ease-out}
@keyframes flash{0%,30%{background:var(--marker)}100%{background:transparent}}
.w{cursor:pointer;border-radius:2px}
.w:hover{background:var(--pencil-wash)}
.w.on{background:var(--marker)}
.show-kw .kw{text-decoration:underline;text-decoration-color:var(--pencil);text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-skip-ink:none}
.show-kw .kw.ph{text-decoration-style:wavy;text-decoration-thickness:1.4px;text-underline-offset:6px}
.show-kw .kw .w{text-decoration:inherit}
.show-pos .ptext{line-height:2.85}
.show-pos .para:first-child .ptext::first-letter{font:inherit;float:none;padding:0}
.show-pos .w{position:relative;display:inline-block;line-height:1.35}
.show-pos .w::after{content:attr(data-pos);position:absolute;left:50%;top:100%;transform:translateX(-50%);font:600 9.5px/1 var(--f-mono);color:var(--pc,var(--pos-f));white-space:nowrap;margin-top:1px;letter-spacing:0;pointer-events:none}
.pn{--pc:var(--pos-n)} .pv{--pc:var(--pos-v)} .pa{--pc:var(--pos-adj)} .pd{--pc:var(--pos-adv)} .pf{--pc:var(--pos-f)}

.blank{display:inline-flex;align-items:baseline;gap:.35em;border:0;border-bottom:1.5px solid var(--ink);background:none;padding:0 .25em;margin:0 .1em;min-width:5.6em;cursor:pointer;color:var(--ink);line-height:1.3;border-radius:2px 2px 0 0;vertical-align:baseline}
.blank:hover{background:var(--pencil-wash)}
.blank.on{background:var(--marker)}
.bn{font:600 .68em var(--f-mono);color:var(--ink-3)}
.bw{font:400 1.08em var(--f-hand);color:var(--pencil);white-space:nowrap}
.blank.ok{border-bottom-color:var(--pencil)}
.blank.ok .bw::after{content:" \2713";font-family:var(--f-body);font-size:.85em}
.blank.bad{border-bottom-color:var(--red)}
.blank.bad s{color:var(--red);text-decoration-thickness:2px}
.blank.shown .bw{color:var(--ink-2)}

.guard{display:block;width:100%;text-align:left;font:400 13px/1.5 var(--f-zh);color:var(--ink-3);background:none;border:1px dashed var(--rule);border-radius:3px;padding:8px 10px;cursor:pointer}
.guard:hover{color:var(--ink);border-color:var(--ink-3)}

/* ---------- word bank ---------- */
.bank{margin-top:2.6rem;border:1.5px solid var(--ink);padding:16px 18px 14px;background:var(--sheet)}
.bank>header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.bank h3{margin:0;font:700 1.3rem/1.2 var(--f-head)}
.bank h3 span{font:500 13px var(--f-zh);color:var(--ink-3);margin-left:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px}
.opt{display:flex;align-items:baseline;gap:.5em;text-align:left;background:none;border:0;padding:6px 6px;border-radius:3px;cursor:pointer;font:400 1.03rem/1.3 var(--f-body);color:var(--ink);min-width:0}
.opt:hover{background:var(--pencil-wash)}
.opt.on{background:var(--marker)}
.opt b{font:600 .78rem var(--f-mono);color:var(--ink-3);min-width:1.7em}
.opt.used{color:var(--ink-3)}
.opt .u{margin-left:auto;font:600 .72rem var(--f-mono);color:var(--pencil)}
.grp+.grp{margin-top:10px}
.grp h4{margin:0 0 4px;font:600 11px/1.6 var(--f-mono);letter-spacing:.08em;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.grp h4 span{color:var(--ink-3);font-weight:400}
.bank-note{margin:10px 0 0;font:400 13px/1.6 var(--f-zh);color:var(--ink-3)}

.tips{margin-top:2.2rem;border-top:3px double var(--ink);padding-top:12px}
.tips h3{margin:0 0 8px;font:700 1.25rem var(--f-head)}
.tips h3 span{font:500 13px var(--f-zh);color:var(--ink-3);margin-left:8px}
.tips ol{margin:0;padding:0;list-style:none;counter-reset:t;display:grid;gap:8px}
.tips li{counter-increment:t;display:grid;grid-template-columns:2rem minmax(0,1fr);font:400 .98rem/1.75 var(--f-zh)}
.tips li::before{content:counter(t);font:600 .8rem/1.9 var(--f-mono);color:var(--pencil)}

/* ---------- side rail / sheet ---------- */
.panel{display:none}
.layout.has-rail .panel{display:block}
.grab{display:none}
@media (min-width:1040px){
  .layout.has-rail .panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:16px 18px 22px}
  .p-close{display:none}
}
.grab-zone{display:none}
@media (max-width:1039.98px){
  .layout.has-rail .panel{position:fixed;left:0;right:0;bottom:0;z-index:20;height:62vh;overflow:auto;overscroll-behavior:contain;background:var(--sheet);border:2px solid var(--ink);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:0 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1),height .28s cubic-bezier(.2,.8,.2,1)}
  .layout.has-rail .panel.full{height:92vh}
  .layout.has-rail .panel.open{transform:none}
  .layout.has-rail .panel.dragging{transition:none}
  .grab-zone{display:block;position:sticky;top:0;z-index:2;margin:0 -18px 4px;padding:10px 0 10px;background:var(--sheet);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
  .grab{display:block;width:44px;height:5px;border-radius:5px;background:var(--ink-3);opacity:.55;margin:0 auto}
  .grab-zone:active .grab{opacity:.9}
}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.p-eyebrow{font:600 11px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--pencil)}
.p-close{background:none;border:1px solid var(--rule);border-radius:999px;width:30px;height:30px;cursor:pointer;color:var(--ink-2);font:400 16px/1 var(--f-mono)}
.p-head{display:flex;align-items:center;gap:10px;margin-top:4px}
.p-word{font:700 2.1rem/1.15 var(--f-head);margin:0;overflow-wrap:anywhere}
.p-meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{display:inline-block;font:600 12px/1.4 var(--f-mono);padding:2px 7px;border-radius:3px;border:1px solid var(--pc,var(--ink-3));color:var(--pc,var(--ink-2))}
.p-zh{font:600 1.15rem/1.6 var(--f-zh);margin:6px 0 0}
.p-miss{font:400 .95rem/1.6 var(--f-zh);color:var(--ink-3);margin:6px 0}
.note{margin-top:12px;background:var(--pencil-wash);border-left:3px solid var(--pencil);padding:8px 11px;font:400 .93rem/1.7 var(--f-zh)}
.note b{font-weight:600;color:var(--pencil)}
.p-sec{margin:18px 0 6px;padding-top:10px;border-top:1px solid var(--rule);font:600 10.5px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.p-en{font:400 1.02rem/1.7 var(--f-body);margin:0 0 8px}
.p-en mark{background:var(--marker);color:inherit;border-radius:2px;padding:0 1px}
.p-en .fill{font:400 1.05em var(--f-hand);color:var(--pencil)}
.p-en .gap{font:600 .85em var(--f-mono);color:var(--ink-3)}
.p-zht{font:400 .95rem/1.85 var(--f-zh);color:var(--ink-2);margin:0}
.p-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pbtn{font:500 13.5px/1.2 var(--f-zh);padding:8px 13px;border-radius:3px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.pbtn:hover{background:var(--pencil-wash)}
.pbtn.primary{background:var(--ink);color:var(--paper)}
.pbtn.primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.pbtn.ghost{border-color:var(--rule);color:var(--ink-2)}
.pbtn:disabled{opacity:.45;cursor:default}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;border:1px solid var(--rule);background:none;color:var(--ink-2);cursor:pointer;flex:none}
.ibtn:hover{color:var(--pencil);border-color:var(--pencil)}
.ibtn svg{width:16px;height:16px}

.phon{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px}
.phon .ipa{font:400 1rem var(--f-body);color:var(--ink-2)}
.tag{font:600 10.5px/1.5 var(--f-mono);letter-spacing:.04em;padding:1px 6px;border-radius:3px;background:var(--paper-2);color:var(--ink-2)}
.tag.hot{background:var(--pencil-wash);color:var(--pencil)}
.stars{font:400 12px var(--f-mono);color:var(--pos-adj);letter-spacing:1px}
.lemma-note{font:400 .92rem/1.6 var(--f-zh);color:var(--ink-2);margin:8px 0 0}
.lemma-note b{font:600 1.02rem var(--f-body);color:var(--ink)}
.ctxbox{margin-top:12px;border:1.5px solid var(--ink);padding:9px 12px 10px;position:relative}
.ctxbox .lbl{display:block;font:600 10.5px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--pencil);margin-bottom:5px}
.ctxbox .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px}
.ctxbox .zh{font:600 1.12rem/1.55 var(--f-zh)}
.ctxbox .cen{margin:6px 0 0;font:italic 400 1rem/1.5 var(--f-body);color:var(--ink-2)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.dl li{display:grid;grid-template-columns:2.9rem minmax(0,1fr);gap:6px;align-items:baseline}
.dl .tp{font:600 11.5px var(--f-mono);color:var(--pc,var(--ink-3))}
.dl .zh{font:400 .97rem/1.65 var(--f-zh)}
.dl .en{font:400 .98rem/1.55 var(--f-body)}
.dl li.hit .zh,.dl li.hit .en{color:var(--ink)}
.dl li:not(.hit) .zh,.dl li:not(.hit) .en{color:var(--ink-2)}
.dl.en-list{counter-reset:d}
.dl.en-list li{grid-template-columns:1.4rem 2.6rem minmax(0,1fr)}
.dl.en-list li::before{counter-increment:d;content:counter(d);font:500 11px var(--f-mono);color:var(--ink-3)}
.exm{display:block;font-style:italic;font-size:.9em;color:var(--ink-3);margin-top:2px}
.exm::before{content:"e.g. ";font:600 10px var(--f-mono);font-style:normal;color:var(--ink-3)}
.more{background:none;border:0;padding:6px 0 0;font:500 12.5px var(--f-zh);color:var(--pencil);cursor:pointer}
.dsrc{margin-top:16px;font:500 10.5px/1.5 var(--f-mono);color:var(--ink-3)}
.dload{font:400 .92rem var(--f-zh);color:var(--ink-3);margin-top:12px}
.xbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;margin-top:18px;padding:11px 14px;background:var(--paper);border:1.5px dashed var(--ink-3);border-radius:4px;cursor:pointer;text-align:left}
.xbtn span{font:600 14.5px var(--f-zh);color:var(--ink)}
.xbtn small{font:500 11.5px var(--f-mono);color:var(--ink-3)}
.xbtn:hover{border-color:var(--pencil);background:var(--pencil-wash)}
.xsec{margin-top:18px;border-top:3px double var(--ink);padding-top:6px}
.xh{margin:8px 0 0;font:700 1.15rem var(--f-head)}
.ety{font:400 .98rem/1.7 var(--f-body);margin:0}
.ai{margin-top:12px;background:var(--pencil-wash);border-left:3px solid var(--pencil);padding:9px 12px}
.ai .lbl{display:block;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--pencil);margin-bottom:4px}
.ai p{margin:6px 0 0;font:400 .93rem/1.75 var(--f-zh)}
.ai p b{font-weight:600;color:var(--pencil);margin-right:6px}
.ai ul{margin:4px 0 0;padding-left:1.1em;font:400 .92rem/1.7 var(--f-zh)}
.ai .exl li{font-family:var(--f-body)}
.ai .exl span{display:block;font:400 .88rem/1.6 var(--f-zh);color:var(--ink-2)}
.roots{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.roots li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font:400 .95rem var(--f-body)}
.roots b{font:600 1rem var(--f-mono);color:var(--pencil)}
.roots .rm{color:var(--ink)} .roots .ro{font:400 12px var(--f-zh);color:var(--ink-3)}
.rel{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rel li{display:grid;grid-template-columns:minmax(6.5rem,auto) auto minmax(0,1fr);gap:8px;align-items:baseline}
.rw{background:none;border:0;padding:2px 0;font:500 1.02rem var(--f-body);color:var(--ink);text-align:left;cursor:pointer;text-decoration:underline dotted var(--ink-3);text-underline-offset:4px}
.rw:hover{color:var(--pencil)}
.rw u{text-decoration:none;color:var(--red);font-weight:700;background:var(--red-wash);border-radius:2px}
.rz{font:400 .9rem/1.5 var(--f-zh);color:var(--ink-2);min-width:0}
.disc-h{font:400 .9rem/1.6 var(--f-zh);color:var(--ink-2);margin:0 0 6px}
.disc{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.disc li{font:400 .9rem/1.7 var(--f-zh);color:var(--ink-2)}
.disc li b{font:600 .98rem var(--f-body);color:var(--ink);margin-right:6px}
.disc li.me b{background:var(--marker);padding:0 3px;border-radius:2px}
.backb{background:none;border:0;padding:4px 0;font:500 13px var(--f-zh);color:var(--pencil);cursor:pointer;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vipa{font:400 .9rem var(--f-body);color:var(--ink-3)}
.ven{font:italic 400 .93rem/1.5 var(--f-body);color:var(--ink-2);margin:0}
.need{font:400 .95rem/1.6 var(--f-zh);margin:8px 0 2px}
.need b{color:var(--pencil);font-weight:600}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin-top:10px}
.pick{display:flex;gap:6px;align-items:baseline;border:1px solid var(--rule);background:var(--paper);padding:7px 8px;border-radius:3px;font:400 .95rem/1.25 var(--f-body);cursor:pointer;color:var(--ink);text-align:left;min-width:0;overflow-wrap:anywhere}
.pick b{font:600 .75rem var(--f-mono);color:var(--ink-3)}
.pick:hover{border-color:var(--ink)}
.pick.cand{border-color:var(--pencil);background:var(--pencil-wash)}
.pick.taken{opacity:.5}
.verdict{font:700 1.5rem/1.2 var(--f-hand);margin:10px 0 4px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--red)} .verdict.shown{color:var(--ink-2)}
.ans-big{display:flex;align-items:baseline;gap:10px;margin:2px 0 6px}
.ans-big b{font:600 1rem var(--f-mono);color:var(--ink-3)}
.ans-big span{font:700 1.9rem/1.1 var(--f-hand);color:var(--pencil)}
.ans-big i{font:400 .95rem var(--f-zh);font-style:normal;color:var(--ink-2)}
.ex{font:400 .95rem/1.85 var(--f-zh);margin:0}
.ex.trap{color:var(--ink-2)}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.cands span{font:500 12.5px/1.4 var(--f-mono);border:1px solid var(--rule);padding:2px 7px;border-radius:3px;color:var(--ink-2)}
.cands span.hit{border-color:var(--pencil);color:var(--pencil);background:var(--pencil-wash)}

.idle h3{font:700 1.3rem/1.2 var(--f-head);margin:.2em 0 .5em}
.idle ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.idle li{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:8px;font:400 .92rem/1.6 var(--f-zh);color:var(--ink-2)}
.idle li b{font:600 11px/1.9 var(--f-mono);color:var(--ink);letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:12px;font:400 .9rem/1.5 var(--f-body)}
.legend .l1{text-decoration:underline 2px var(--pencil);text-underline-offset:4px}
.legend .l2{text-decoration:underline wavy 1.4px var(--pencil);text-underline-offset:5px}
.posleg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ---------- archive ---------- */
.sect-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:18px}
.sect-head h2{font:700 clamp(1.7rem,4vw,2.3rem)/1.1 var(--f-head);margin:0}
.sect-head p{margin:0;font:500 12px var(--f-mono);color:var(--ink-3)}
.issues{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0 28px}
.issue{border-top:1.5px solid var(--ink);padding:14px 0 22px;display:flex;flex-direction:column;gap:8px;min-width:0}
.issue .no{display:flex;justify-content:space-between;font:500 11px var(--f-mono);color:var(--ink-3);letter-spacing:.06em}
.issue h3{margin:0;font:700 1.45rem/1.15 var(--f-head);text-wrap:balance}
.issue h3 button{all:unset;cursor:pointer}
.issue h3 button:hover{color:var(--pencil)}
.issue h3 button:focus-visible{outline:2px solid var(--pencil)}
.issue .izh{font:400 .95rem var(--f-zh);color:var(--ink-2);margin:0}
.bar{height:4px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pencil)}
.imeta{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 12px var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.iact{display:flex;gap:8px;margin-top:2px}

/* ---------- vocab ---------- */
.vtools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px}
.vtools select{font:500 13px var(--f-zh);padding:6px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);color:var(--ink);max-width:100%}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.vitem{background:var(--sheet);border:1px solid var(--rule);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.vitem.done{opacity:.66}
.vhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vhead b{font:700 1.45rem/1.1 var(--f-head);overflow-wrap:anywhere}
.vzh{font:600 1rem/1.6 var(--f-zh);margin:0;border-radius:3px;transition:filter .2s}
.vzh.blur{filter:blur(6px);cursor:pointer;user-select:none}
.vctx{font:400 .95rem/1.65 var(--f-body);color:var(--ink-2);margin:0}
.vctx mark{background:var(--marker);color:var(--ink);border-radius:2px;padding:0 1px}
.vsrc{font:500 11.5px var(--f-mono);color:var(--ink-3)}
.vact{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.vact .pbtn{padding:6px 10px;font-size:12.5px}

/* ---------- import ---------- */
.imp{max-width:46rem}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;margin:6px 0 18px}
.seg button{background:none;border:0;padding:7px 14px;font:500 13px var(--f-zh);cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.field label span{text-transform:none;letter-spacing:0;font:400 12px var(--f-zh);color:var(--ink-3);margin-left:6px}
.field input[type=text],.field textarea{width:100%;font:400 1rem/1.6 var(--f-body);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:10px 12px}
.field textarea{min-height:8rem;resize:vertical}
.field textarea#impText{min-height:14rem}
.drop{border:1.5px dashed var(--rule);border-radius:4px;padding:18px;text-align:center;font:400 .95rem/1.6 var(--f-zh);color:var(--ink-2);background:var(--sheet)}
.drop img{display:block;max-height:220px;margin:10px auto 0;border:1px solid var(--rule)}
.imp-pages{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;text-align:left}
.imp-pages li{border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:4px}
.imp-pages img{display:block;width:100%;height:120px;object-fit:cover;margin:0;border:0;border-radius:2px;background:var(--sheet)}
.imp-pg{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:4px;font-size:.8rem;color:var(--ink-2)}
.imp-pg .ibtn{min-width:28px;min-height:28px}
.imp-add{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.imp-add input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.imp-full{margin:0;color:var(--ink-3)}
.imp-status{margin-top:14px;font:400 .95rem/1.6 var(--f-zh);min-height:1.6em}
.imp-status .err{color:var(--red)}
.imp-status .done{color:var(--ok)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--rule);border-top-color:var(--pencil);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.imp-alt{margin-top:22px;padding-top:12px;border-top:1px solid var(--rule);font:400 .92rem/1.7 var(--f-zh);color:var(--ink-3)}

.empty{max-width:34rem;margin:40px auto;text-align:center}
.empty h2{font:700 1.8rem var(--f-head);margin:.2em 0}
.empty p{font:400 1rem/1.8 var(--f-zh);color:var(--ink-2)}
.skel{height:14px;background:var(--paper-2);border-radius:3px;margin:12px 0;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

.foot{margin-top:56px;border-top:1px solid var(--rule);padding-top:12px;text-align:center;font:500 11px/1.6 var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font:500 14px/1.4 var(--f-zh);padding:10px 16px;border-radius:4px;z-index:40;max-width:calc(100% - 32px)}
/* ---------- word status in the text ---------- */
.show-st .w.st1{background:var(--st1);box-shadow:inset 0 -2px 0 var(--st1-ink)}
.show-st .w.st2{background:var(--st2)}
#body .w.on{background:var(--marker);box-shadow:0 0 0 2px var(--pencil)}
.legend .lg{padding:0 4px;border-radius:2px}
.legend .lg.st1{background:var(--st1);box-shadow:inset 0 -2px 0 var(--st1-ink)}
.legend .lg.st2{background:var(--st2)}
.nwbtn b{font:600 12px var(--f-mono);margin-left:3px}

/* ---------- level & status chips ---------- */
.lvl{display:inline-block;font:600 11.5px/1.5 var(--f-zh);padding:0 7px;border:1px solid var(--rule);border-radius:4px;color:var(--ink-2);white-space:nowrap}
.lvl-4{border-color:var(--ink-3);color:var(--ink)}
.lvl-6,.lvl-k{border-color:var(--pencil);color:var(--pencil)}
.lvl-t,.lvl-g{border-color:var(--red);color:var(--red)}
.lvl-x,.lvl-pn,.lvl-f{border-style:dashed;color:var(--ink-3)}
.lvl.cefr{font:700 11px/1.55 var(--f-mono);letter-spacing:.03em;padding:0 6px;border-color:transparent}
.lvl.cA{background:var(--ok-wash);color:var(--ok)}
.lvl.cB{background:var(--pencil-wash);color:var(--pencil)}
.lvl.cC{background:var(--red-wash);color:var(--red)}
.lvl+.lvl{margin-left:4px}
.stp{font:600 11px/1.5 var(--f-zh);padding:0 7px;border-radius:4px;white-space:nowrap}
.stp.st-new{background:var(--st1);color:var(--st1-ink)}
.stp.st-learning{background:var(--st2);color:var(--st2-ink)}
.stp.st-known{background:var(--ok-wash);color:var(--ok)}
.stp.st-ignored{background:var(--paper-2);color:var(--ink-3)}
.st-b{padding:6px 0;border:1px solid var(--rule);border-radius:7px;background:transparent;font:500 12.5px var(--f-zh);color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.st-b:hover{border-color:var(--ink-3);color:var(--ink)}
.st-b.on.st-new{background:var(--st1);border-color:var(--st1-ink);color:var(--st1-ink);font-weight:600}
.st-b.on.st-learning{background:var(--st2);border-color:var(--st2-ink);color:var(--st2-ink);font-weight:600}
.st-b.on.st-known{background:var(--ok-wash);border-color:var(--ok);color:var(--ok);font-weight:600}
.st-b.on.st-ignored{background:var(--paper-2);border-color:var(--ink-3);color:var(--ink);font-weight:600}
.mini-st{display:flex;flex-wrap:wrap;gap:4px}
.mini-st .st-b{padding:3px 8px;font-size:11.5px}

/* ---------- floating word card ---------- */
.pop{position:fixed;z-index:30;left:0;top:0;display:flex;flex-direction:column;background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);border-radius:14px;box-shadow:var(--pop-shadow);overflow:hidden;max-height:70vh;animation:popin .16s ease-out}
.pop[hidden]{display:none}
@keyframes popin{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.pop-hd{display:flex;align-items:flex-start;gap:10px;padding:14px 10px 4px 18px;flex:none}
.pop-tt{flex:1;min-width:0}
.pop-back{background:none;border:0;padding:0 0 4px;font:500 12.5px var(--f-zh);color:var(--pencil);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.pop-w{font:700 1.85rem/1.15 var(--f-head);overflow-wrap:anywhere}
.pop-ipa{background:none;border:0;padding:0;font:400 1.02rem var(--f-body);color:var(--ink-2);cursor:pointer}
.pop-ipa:hover{color:var(--pencil)}
.pop-x{flex:none;width:34px;height:34px;border-radius:999px;border:0;background:none;color:var(--ink-2);font:300 24px/1 var(--f-mono);cursor:pointer}
.pop-x:hover{background:var(--paper-2);color:var(--ink)}
.pop-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:2px 18px 14px}
.pop-lem{margin:2px 0 6px;font:400 .88rem/1.5 var(--f-zh);color:var(--ink-3)}
.pop-lem b{font:600 .95rem var(--f-body);color:var(--ink-2)}
.pop-ctx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;margin:8px 0 6px;padding:8px 10px;border-radius:8px;background:var(--pencil-wash)}
.pop-lbl{font:600 11.5px/1.6 var(--f-zh);color:var(--pencil);letter-spacing:.06em}
.pop-ctxm{min-width:0}
.pop-ctxzh{font:600 1.02rem/1.5 var(--f-zh)}
.pop-ctxen{display:block;font:italic 400 .93rem/1.45 var(--f-body);color:var(--ink-2);margin-top:2px}
.pop-mean{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px}
.pop-mean li{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:4px;font:400 1rem/1.55 var(--f-zh)}
.pop-mean .tp,.pop-en .tp{font:600 12px/1.9 var(--f-mono);color:var(--pc,var(--ink-3))}
.pop-en{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:4px;margin:4px 0 0;font:400 .95rem/1.5 var(--f-body);color:var(--ink-2)}
.pop-kw{margin-top:8px;padding:6px 10px;border-left:3px solid var(--pencil);font:400 .9rem/1.6 var(--f-zh);color:var(--ink-2)}
.pop-kw b{color:var(--pencil);font-weight:600;margin-right:6px}
.pop-act{display:flex;gap:8px;margin-top:14px}
.pa-btn{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:600 13.5px var(--f-zh);cursor:pointer}
.pa-btn:hover{border-color:var(--ink-3)}
.pa-btn svg{width:16px;height:16px}
.pa-sel{flex:1 1 auto;min-width:0;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:500 13.5px var(--f-zh)}
.pa-save{background:var(--pencil);border-color:var(--pencil);color:var(--sheet)}
.pa-save:hover{border-color:var(--pencil);filter:brightness(1.08)}
.pa-save.on{background:transparent;color:var(--pencil)}
.pop-newcat{display:flex;gap:8px;margin-top:8px}
.pop-newcat input{flex:1;min-width:0;padding:8px 10px;border:1.5px solid var(--pencil);border-radius:8px;background:var(--paper);color:var(--ink);font:500 14px var(--f-zh)}
.pop-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.pop-detail{margin-top:6px}
.pop-detail .phon{margin-top:12px}
.pop-detail .xsec{margin-top:4px;border-top:0;padding-top:0}
.pop-foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;padding:10px 18px 12px;border-top:1px solid var(--rule);background:var(--sheet)}
.pop-links{display:flex;flex-wrap:wrap;gap:4px 14px;min-width:0}
.pop-links a{font:500 13px/1.6 var(--f-zh);color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.pop-links a:hover{color:var(--pencil);text-decoration-color:var(--pencil)}
.pop-more{background:none;border:0;padding:4px 0;font:600 13px var(--f-zh);color:var(--pencil);cursor:pointer;white-space:nowrap}
@media (max-width:620px){.pop-w{font-size:1.6rem}.pop-body{padding-inline:16px}.pop-hd{padding-left:16px}.pop-foot{padding-inline:16px}}

/* ---------- 本篇生词 ---------- */
.nw-sum{font:400 .92rem/1.6 var(--f-zh);color:var(--ink-2);margin:8px 0 10px}
.nw-sum b{font:600 1rem var(--f-mono);color:var(--ink)}
.seg.sm{margin:0 0 4px}
.seg.sm button{padding:5px 11px;font-size:12.5px}
.nw{list-style:none;margin:0;padding:0}
.nw li{display:grid;gap:5px;padding:9px 0;border-bottom:1px solid var(--rule)}
.nw-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nw-w{background:none;border:0;padding:0;font:600 1.06rem var(--f-body);color:var(--ink);cursor:pointer;text-decoration:underline dotted var(--ink-3);text-underline-offset:4px}
.nw-w:hover{color:var(--pencil)}
.nw-n{margin-left:auto;font:500 11px var(--f-mono);color:var(--ink-3)}
.nw-zh{font:400 .9rem/1.5 var(--f-zh);color:var(--ink-2)}

/* ---------- vocab book ---------- */
.vtabs{margin:0 0 16px}
.vtools input[type=search]{flex:1 1 12rem;min-width:0;font:400 14px var(--f-zh);padding:7px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);color:var(--ink)}
.vword{background:none;border:0;padding:0;font:700 1.45rem/1.1 var(--f-head);color:var(--ink);cursor:pointer;overflow-wrap:anywhere;text-align:left}
.vword:hover{color:var(--pencil)}
.vitem{border-radius:10px}
.vitem.vs-new{box-shadow:inset 3px 0 0 var(--st1-ink)}
.vitem.vs-learning{box-shadow:inset 3px 0 0 var(--st2-ink)}
.vitem.vs-known{box-shadow:inset 3px 0 0 var(--ok)}
.vitem.vs-ignored{opacity:.7}
.vact select{font:500 12.5px var(--f-zh);padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);max-width:9rem}
.rv{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.rv-intro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rv-stat{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px;text-align:center}
.rv-stat b{display:block;font:600 1.8rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.rv-stat span{font:400 .85rem var(--f-zh);color:var(--ink-2)}
.rv-set{display:flex;align-items:center;gap:10px;font:500 .9rem var(--f-zh);color:var(--ink-2)}
.rv-set select{font:500 14px var(--f-zh);padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);max-width:100%;min-width:0}
.pbtn.big{padding:12px 18px;font-size:15px;border-radius:10px;width:100%}
.pbtn small{font:500 11px var(--f-mono);opacity:.7;margin-left:4px}
.rv-card{background:var(--sheet);border:1.5px solid var(--ink);border-radius:16px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px}
.rv-card.done{text-align:center}
.rv-prog{display:flex;justify-content:space-between;font:500 12px var(--f-mono);color:var(--ink-3)}
.rv-w{font:700 clamp(2.1rem,7vw,2.8rem)/1.1 var(--f-head);text-align:center;overflow-wrap:anywhere}
.rv-ipa{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--ink-2);font:400 1.05rem var(--f-body);min-height:32px}
.rv-ctx{margin:0;font:400 1.02rem/1.7 var(--f-body);color:var(--ink-2);border-left:2px solid var(--rule);padding-left:12px}
.rv-ctx mark{background:var(--marker);color:var(--ink);border-radius:2px;padding:0 1px}
.rv-ans{border-top:1px dashed var(--rule);padding-top:12px;font:400 1.08rem/1.6 var(--f-zh)}
.rv-ans .ven{margin-top:4px}
.rv-done{font:700 1.4rem var(--f-zh);margin:6px 0}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);cursor:pointer;font:600 14px var(--f-zh)}
.rate button:hover{border-color:currentColor}
.rate small{font:500 11px var(--f-mono);color:var(--ink-3)}
.rate .r1{color:var(--red)} .rate .r2{color:var(--st2-ink)} .rate .r3{color:var(--ok)} .rate .r4{color:var(--pencil)}
.dt-zh{margin:0;text-align:center;font:600 1.2rem/1.6 var(--f-zh)}
.dt-hint{margin:0;text-align:center;font:500 13px var(--f-mono);color:var(--ink-3);letter-spacing:.08em}
.dt-in{width:100%;font:500 1.4rem var(--f-body);padding:10px 14px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);text-align:center;letter-spacing:.03em}
.dt-res{margin:0;text-align:center;font:600 1.45rem var(--f-body)}
.dt-res.ok{color:var(--ok)}
.dt-res s{color:var(--red);font-weight:400}
.dt-diff u{text-decoration:none;color:var(--red);background:var(--red-wash);border-radius:2px}
.gapw{font:600 .9em var(--f-mono);color:var(--pencil)}
.dt-wrong{list-style:none;margin:0;padding:0;display:grid;gap:6px;text-align:left}
.dt-wrong li{display:flex;gap:12px;align-items:baseline;font:400 1rem var(--f-body)}
.dt-wrong s{color:var(--red)}
.bk{display:grid;gap:16px;max-width:44rem}
.bk-item{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.bk-item h4{margin:0 0 4px;font:700 1.1rem var(--f-zh)}
.bk-item p{margin:0 0 12px;font:400 .93rem/1.7 var(--f-zh);color:var(--ink-2)}
.bk-item select{font:500 13px var(--f-zh);padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.bk-item input[type=file]{font:400 13px var(--f-zh);color:var(--ink-2);max-width:100%}
.bk textarea{width:100%;min-height:10rem;font:400 12px/1.5 var(--f-mono);padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}

/* ---------- scrollbars: thin rounded pill, themed, no arrow buttons ---------- */
/* Chrome / Edge / Safari: custom pill (they ignore these if scrollbar-color is set, so that stays Firefox-only below) */
.pop-body::-webkit-scrollbar,.panel::-webkit-scrollbar,.bk textarea::-webkit-scrollbar,.field textarea::-webkit-scrollbar{width:10px;height:10px;background:transparent}
.pop-body::-webkit-scrollbar-track,.panel::-webkit-scrollbar-track,.bk textarea::-webkit-scrollbar-track,.field textarea::-webkit-scrollbar-track{background:transparent;margin-block:10px}
.pop-body::-webkit-scrollbar-thumb,.panel::-webkit-scrollbar-thumb,.bk textarea::-webkit-scrollbar-thumb,.field textarea::-webkit-scrollbar-thumb{background-color:var(--sb);border-radius:10px;border:3px solid transparent;background-clip:padding-box;min-height:44px}
.pop-body:hover::-webkit-scrollbar-thumb,.panel:hover::-webkit-scrollbar-thumb{background-color:var(--sb-hover)}
.pop-body::-webkit-scrollbar-thumb:hover,.panel::-webkit-scrollbar-thumb:hover,.pop-body::-webkit-scrollbar-thumb:active,.panel::-webkit-scrollbar-thumb:active{border-width:2px;background-color:var(--sb-active)}
.pop-body::-webkit-scrollbar-button,.panel::-webkit-scrollbar-button,.bk textarea::-webkit-scrollbar-button,.field textarea::-webkit-scrollbar-button{display:none;width:0;height:0}
.pop-body::-webkit-scrollbar-corner,.panel::-webkit-scrollbar-corner{background:transparent}
/* Firefox */
@supports not selector(::-webkit-scrollbar){
  .pop-body,.panel,.bk textarea,.field textarea{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
  .pop-body:hover,.panel:hover{scrollbar-color:var(--sb-hover) transparent}
}
@media (pointer:fine){.pop-body{scrollbar-gutter:stable;padding-right:8px}}

/* ===================== motion system ===================== */
:root{--ease-out:cubic-bezier(.2,.8,.2,1);--ease-spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes fadein{from{opacity:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}}
@keyframes viewin{from{opacity:0;transform:translateY(14px)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes grow{from{transform:scaleX(0)}}

/* masthead: the press rolls in */
.mast-top{animation:fadein .6s var(--ease-out) both}
.mast-name{animation:mastin 1s var(--ease-out) both}
.mast-sub{animation:fadein .8s .3s var(--ease-out) both}
.tabs{position:relative;animation:rulein 1s .12s var(--ease-out) both}
@keyframes mastin{from{opacity:0;transform:translateY(12px) scale(.985);filter:blur(4px);letter-spacing:.05em}}
@keyframes rulein{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 0 0 0)}}

/* sliding tab indicator */
.tab[aria-current="page"]::after{display:none}
.tab{transition:color .2s}
.tab:hover{color:var(--ink)}
.tab-ind{position:absolute;left:0;bottom:4px;height:2px;width:0;background:var(--pencil);border-radius:2px;opacity:0;pointer-events:none;transition:transform .5s var(--ease-spring),width .45s var(--ease-out),opacity .2s}

/* view change */
.view.enter>*{animation:viewin .45s var(--ease-out) both}
.view.enter :is(.issue,.vitem,.mk){animation:viewin .5s var(--ease-out) both}
.view.enter :is(.issue,.vitem,.mk):nth-child(2){animation-delay:.05s}
.view.enter :is(.issue,.vitem,.mk):nth-child(3){animation-delay:.1s}
.view.enter :is(.issue,.vitem,.mk):nth-child(4){animation-delay:.15s}
.view.enter :is(.issue,.vitem,.mk):nth-child(n+5){animation-delay:.2s}
.view.enter .bar i{transform-origin:left;animation:grow 1s .25s var(--ease-out) both}

/* micro-interactions */
.pbtn,.tbtn,.st-b,.pa-btn,.pick,.dot,.opt{transition:background-color .2s,border-color .2s,color .2s,transform .14s var(--ease-out),box-shadow .2s}
.pbtn.primary:hover{transform:translateY(-1px)}
:is(.pbtn,.tbtn,.st-b,.pa-btn,.pick,.dot,.opt,.mk-bar):active{transform:scale(.96)}
.w{transition:background-color .15s}
.issue{transition:transform .25s var(--ease-out)}
.issue:hover{transform:translateY(-3px)}
.w.nope{animation:shake .4s}

/* floating card open / close from its word */
.pop{animation:none;transform-origin:50% 0}
.pop[data-side="above"]{transform-origin:50% 100%;--dy:8px}
.pop.opening{animation:popopen .28s var(--ease-spring) both}
.pop.leaving{animation:popclose .15s ease-in both;pointer-events:none}
@keyframes popopen{from{opacity:0;transform:translateY(var(--dy,-8px)) scale(.94)}}
@keyframes popclose{to{opacity:0;transform:scale(.96)}}

/* save button: bookmark drops in, page corner folds */
.pa-save{position:relative;overflow:hidden}
.pa-save svg{width:15px;height:15px}
.pa-save::after{content:"";position:absolute;top:0;right:0;width:13px;height:13px;background:linear-gradient(225deg,var(--sheet) 0 50%,var(--pencil) 50% 100%);border-bottom-left-radius:4px;transform:scale(0);transform-origin:100% 0;transition:transform .35s var(--ease-spring);box-shadow:-1px 1px 2px rgba(0,0,0,.18)}
.pa-save.on::after{transform:scale(1)}
.pa-save.on.just::after{animation:fold .45s .1s var(--ease-spring) both}
.pa-save.on.just svg{animation:bookmark .5s var(--ease-spring)}
@keyframes fold{from{transform:scale(0)}}
@keyframes bookmark{from{transform:translateY(-8px) scale(.7);opacity:0}}

/* toast */
.toast{border-radius:999px;padding:10px 18px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.toast.in{animation:toastin .38s var(--ease-spring)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px) scale(.95)}}

/* ===================== answering ===================== */
/* pencil writes the word in */
.blank.ink .bw,.blank.just .bw{animation:ink .55s var(--ease-out) both}
@keyframes ink{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.blank.just.ok{animation:okstamp .6s var(--ease-spring)}
@keyframes okstamp{35%{transform:scale(1.14)}}
.blank.just.bad{animation:shake .45s}
.blank.bad s{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 58%/100% 2px no-repeat}
.blank.just.bad s{animation:strike .35s .25s var(--ease-out) both}
@keyframes strike{from{background-size:0 2px}}
.blank.rvl{animation:flipin .6s var(--ease-out) both;animation-delay:calc(var(--i,0) * 85ms + 120ms)}
@keyframes flipin{from{opacity:0;transform:perspective(420px) rotateX(-85deg)}}
.blank{transition:background-color .2s,box-shadow .2s}
/* phones: the blank's line is only ~14 px tall — give the finger a bigger target without moving the text */
@media (pointer:coarse){ #body .blank{position:relative} #body .blank::after{content:'';position:absolute;left:-4px;right:-4px;top:-12px;bottom:-10px} }
/* exam blanks */
.blank.ex{border-bottom-style:dashed;border-bottom-color:var(--ink-3)}
.blank.ex.filled{border-bottom-style:solid;border-bottom-color:var(--ink)}
.blank.ex.filled .bw{color:var(--ink)}
.blank.ex.sel{background:var(--pencil-wash);box-shadow:0 0 0 2px var(--pencil);border-radius:5px;border-bottom-color:transparent}
.blank.ex.sel:not(.filled) .bw::after{content:"";display:inline-block;width:1.5px;height:1em;background:var(--pencil);vertical-align:-2px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

/* mode switch */
.toolbar{align-items:center}
.mseg{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border:1px solid var(--ink);border-radius:999px;margin-right:6px;isolation:isolate}
.mseg button{position:relative;z-index:1;background:none;border:0;padding:5px 15px;font:600 13px/1.2 var(--f-zh);color:var(--ink-2);cursor:pointer;border-radius:999px;transition:color .3s}
.mseg button[aria-pressed="true"]{color:var(--paper)}
.mseg-thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--ink);transition:transform .45s var(--ease-spring)}
.mseg:has(button[data-m="exam"][aria-pressed="true"]) .mseg-thumb{transform:translateX(100%)}
.mode-warn{margin:-14px 0 18px;font:400 .88rem/1.6 var(--f-zh);color:var(--red);animation:fadeup .3s var(--ease-out)}

/* exam bar */
.exbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:12;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:-8px 0 24px;padding:10px 12px 10px 14px;background:var(--sheet);background:color-mix(in srgb,var(--sheet) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1.5px solid var(--ink);border-radius:16px;box-shadow:0 12px 32px rgba(20,24,27,.10);animation:barin .45s var(--ease-out) both}
@keyframes barin{from{opacity:0;transform:translateY(-10px)}}
.exbar.idle{justify-content:space-between}
.exb-intro{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 15rem}
.exb-intro b{font:700 1rem var(--f-zh)}
.exb-intro span{font:400 .88rem/1.55 var(--f-zh);color:var(--ink-2)}
.exb-t{display:flex;align-items:center;gap:8px;flex:none}
.ring{width:34px;height:34px;transform:rotate(-90deg);flex:none}
.ring circle,.res-ring circle{fill:none}
.ring circle{stroke-width:3.2}
.ring .rt,.res-ring .rt{stroke:var(--rule)}
.ring .rf{stroke:var(--pencil);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.exbar.over .ring .rf{stroke:var(--red)}
.exb-time{font:600 1.15rem var(--f-mono);font-variant-numeric:tabular-nums;min-width:3.2em}
.exbar.over .exb-time{color:var(--red)}
.exb-dots{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 auto;min-width:0}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);background:transparent;font:600 10px/1 var(--f-mono);color:var(--ink-3);cursor:pointer;padding:0}
.dot:hover{border-color:var(--ink-3)}
.dot.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dot.sel{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--pencil)}
.dot.just{animation:dotpop .5s var(--ease-spring)}
@keyframes dotpop{0%{transform:scale(.55)}60%{transform:scale(1.18)}}
.exb-sub{flex:none;border-radius:10px}
.exb-sub small{opacity:.7;font:500 11px var(--f-mono);margin-left:4px}
.exb-sub.ready{animation:ready 1.8s ease-in-out infinite}
@keyframes ready{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 6px var(--pencil-wash)}}
.exb-sub.warn{background:var(--red);border-color:var(--red);color:var(--sheet)}
@media (max-width:620px){.exb-dots{order:3;flex-basis:100%;justify-content:space-between}.dot{width:28px;height:28px}.exbar{gap:8px 10px}}

/* bank & pickers in exam */
.bank.exam .opts{gap:6px}
.bank.exam .opt{border:1px solid var(--rule);border-radius:9px;background:var(--paper);padding:7px 9px}
.bank.exam .opt:hover{border-color:var(--ink);transform:translateY(-1px)}
.bank.exam .opt.used{opacity:.5}
.bank.exam .opt.chosen{opacity:1;border-color:var(--pencil);background:var(--pencil-wash)}
.pick span{min-width:0}
.pick i{margin-left:auto;font:600 10.5px var(--f-mono);font-style:normal;color:var(--ink-3);padding-left:4px}
.pick.chosen{border-color:var(--pencil);background:var(--pencil-wash);box-shadow:inset 0 0 0 1px var(--pencil)}
.pick.no{opacity:.45;border-color:var(--red);text-decoration:line-through}
.pick:hover{transform:translateY(-1px)}
.ep-gap{background:var(--marker);border-radius:3px;padding:0 3px}
.fixit{display:block;margin-top:10px}

/* ===================== result card ===================== */
.res-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 6px}
.res-ring{position:relative;width:120px;height:120px;flex:none}
.res-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.res-ring circle{stroke-width:2.4}
.res-ring .rf{stroke:var(--pencil);stroke-linecap:round;stroke-dashoffset:var(--off);animation:ringfill 1.2s .15s var(--ease-out) both}
@keyframes ringfill{from{stroke-dashoffset:94.25}}
.res-score{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;gap:3px;padding-top:40px;font:700 2.7rem/1 var(--f-head);font-variant-numeric:tabular-nums}
.res-score small{font:500 .95rem var(--f-mono);color:var(--ink-3)}
.stamp{font:900 1.3rem/1 var(--f-zh);letter-spacing:.22em;padding:10px 10px 10px 15px;border:3px double currentColor;border-radius:6px;transform:rotate(-9deg);opacity:.9;animation:stamp .55s .75s var(--ease-spring) both}
.stamp.s-top,.stamp.s-good{color:var(--red)}
.stamp.s-ok{color:var(--pencil)}
.stamp.s-low{color:var(--ink-3)}
@keyframes stamp{from{opacity:0;transform:rotate(-9deg) scale(2.4)}to{opacity:.9;transform:rotate(-9deg) scale(1)}}
.res-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 12.5px/1.6 var(--f-zh);color:var(--ink-2);margin-bottom:8px}
.res-meta b{font:600 13px var(--f-mono);color:var(--ink)}
.res-list{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.res-list li{animation:fadeup .4s var(--ease-out) both;animation-delay:calc(var(--i) * 55ms + .35s)}
.res-list button{display:grid;grid-template-columns:2.1rem 1.1rem auto minmax(0,1fr);align-items:baseline;gap:6px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;font:400 .98rem var(--f-body);color:var(--ink)}
.res-list button:hover{background:var(--pencil-wash)}
.res-list b{font:600 12px var(--f-mono);color:var(--ink-3)}
.res-list .ok .rr-mark{color:var(--ok)}
.res-list .bad .rr-mark{color:var(--red)}
.res-list .bad .rr-w{color:var(--red);text-decoration:line-through}
.rr-ans{color:var(--ok);font-weight:600}
.iscore{color:var(--pencil);font-weight:600}

/* ===================== mistake book ===================== */
.mk-chart{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.mk-bars{display:grid;gap:6px}
.mk-bar{display:grid;grid-template-columns:6.4rem minmax(0,1fr) 2rem;align-items:center;gap:10px;background:none;border:0;padding:5px 8px;border-radius:9px;cursor:pointer;text-align:left;color:var(--ink)}
.mk-bar:hover,.mk-bar.on{background:var(--pencil-wash)}
.mk-bl{font:500 .9rem var(--f-zh)}
.mk-track{height:10px;border-radius:999px;background:var(--paper-2);overflow:hidden}
.mk-fill{display:block;height:100%;border-radius:999px;transform-origin:left;transform:scaleX(var(--w));transition:transform .5s var(--ease-out)}
.view.enter .mk-fill{animation:grow .9s .15s var(--ease-out) both}
.mk-bar b{font:600 1rem var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.t-pos{background:var(--pencil)}
.t-form{background:var(--st2-ink)}
.t-sense{background:var(--st1-ink)}
.t-blank{background:var(--ink-3)}
.mk-tip{margin:12px 0 0;font:400 .92rem/1.75 var(--f-zh);color:var(--ink-2)}
.mk-tip b{color:var(--ink);margin-right:4px}
.mk-list{display:grid;gap:14px}
.mk{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;display:grid;gap:10px;transition:opacity .25s,transform .25s var(--ease-out)}
.mk.done{opacity:.72}
.mk.out{opacity:0;transform:translateX(28px)}
.mk.shake{animation:shake .45s}
.mk.okfx{animation:okglow 1.1s var(--ease-out)}
@keyframes okglow{30%{box-shadow:0 0 0 4px var(--ok-wash);border-color:var(--ok)}}
.mk-hd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:500 12px var(--f-zh);color:var(--ink-3)}
.mk-type{font:600 11.5px/1.6 var(--f-zh);padding:1px 9px;border-radius:999px;color:var(--sheet)}
.mk-times{color:var(--red)}
.mk-ok{color:var(--ok);font-weight:600}
.mk-sent{margin:0;font:400 1.06rem/1.9 var(--f-body)}
.mk-other{color:var(--ink-2);font-style:italic}
.mk-wrong{color:var(--red);text-decoration:line-through;text-decoration-thickness:2px}
.mk-none{font:500 .85em var(--f-zh);color:var(--ink-3)}
.mk-ans{color:var(--ok);font-weight:600;background:var(--ok-wash);padding:0 4px;border-radius:3px}
.mk-gap{font:600 .9em var(--f-mono);color:var(--pencil);background:var(--pencil-wash);padding:0 5px;border-radius:3px}
.mk-why{border-left:3px solid var(--rule);padding:2px 0 2px 12px;display:grid;gap:4px;animation:fadeup .35s var(--ease-out)}
.mk-why p{margin:0;font:400 .92rem/1.75 var(--f-zh);color:var(--ink-2)}
.mk-why b{color:var(--pencil);font-weight:600;margin-right:6px}
.mk-res{margin:0;font:600 .95rem var(--f-zh);animation:fadeup .3s var(--ease-out)}
.mk-res.ok{color:var(--ok)}
.mk-res.bad{color:var(--red)}
.mk-act{display:flex;flex-wrap:wrap;gap:8px}
.mk-picks{margin-top:0;animation:fadeup .3s var(--ease-out)}

/* ===================== editor ===================== */
.ed{max-width:54rem;margin-inline:auto}
.ed-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:12;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;margin-bottom:16px;background:var(--sheet);background:color-mix(in srgb,var(--sheet) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1.5px solid var(--ink);border-radius:16px;box-shadow:0 12px 32px rgba(20,24,27,.08)}
.ed-ttl{font:700 1.15rem var(--f-head)}
.ed-btns{display:flex;gap:8px}
.ed-h{margin:28px 0 12px;font:700 1.2rem var(--f-zh);border-bottom:1px solid var(--ink);padding-bottom:6px}
.ed-h small{font:400 .82rem var(--f-zh);color:var(--ink-3);margin-left:8px}
.ed label{display:flex;flex-direction:column;gap:5px;font:600 11.5px var(--f-zh);letter-spacing:.04em;color:var(--ink-2);min-width:0}

/* ===================== review & dictation motion ===================== */
.rv-card.enter{animation:cardin .4s var(--ease-out) both}
@keyframes cardin{from{opacity:0;transform:translateX(26px) rotate(.6deg)}}
.rv-ans{animation:fadeup .3s var(--ease-out) both}
.rate button{animation:fadeup .35s var(--ease-out) both}
.rate button:nth-child(2){animation-delay:.04s}
.rate button:nth-child(3){animation-delay:.08s}
.rate button:nth-child(4){animation-delay:.12s}
.dt-res{animation:fadeup .3s var(--ease-out) both}
.dt-res.bad{animation:shake .45s}
.rv-stat b{font-variant-numeric:tabular-nums}

/* ---------- import progress: "编辑部 · 正在排版" (see impPaint in base.html) ---------- */
.impp{padding:18px 18px 16px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;box-shadow:0 1px 0 var(--rule),0 10px 30px -18px rgba(20,24,27,.35)}
.impp-hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.impp-t{font:500 13px var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.impp-steps{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;counter-reset:st}
.impp-steps li{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:7px;font:500 12.5px/1.35 var(--f-zh);color:var(--ink-3);counter-increment:st;transition:color .3s}
.impp-steps li i{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--rule);background:var(--sheet);display:grid;place-items:center;font:600 11px var(--f-mono);font-style:normal;color:var(--ink-3);transition:background-color .35s,border-color .35s,color .35s}
.impp-steps li i::before{content:counter(st)}
.impp-steps li:not(:last-child)::after{content:'';position:absolute;top:12px;left:30px;right:2px;height:1.5px;background:linear-gradient(90deg,var(--pencil) 50%,var(--rule) 50%);background-size:200% 100%;background-position:100% 0;transition:background-position .7s var(--ease-out)}
.impp-steps li.done{color:var(--ink-2)}
.impp-steps li.done i{background:var(--pencil);border-color:var(--pencil);color:var(--sheet)}
.impp-steps li.done i::before{content:'✓';font-size:12px}
.impp-steps li.done::after{background-position:0 0}
.impp-steps li.on{color:var(--ink)}
.impp-steps li.on i{border-color:var(--pencil);color:var(--pencil)}
.impp-steps li.on i::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--pencil);animation:imppRing 1.8s var(--ease-out) infinite}
@keyframes imppRing{0%{transform:scale(.65);opacity:.75}100%{transform:scale(1.25);opacity:0}}
.impp-bar{height:4px;border-radius:4px;background:var(--paper-2);overflow:hidden;margin-bottom:14px}
.impp-bar b{position:relative;display:block;height:100%;width:3%;border-radius:4px;background:var(--pencil);overflow:hidden;transition:width .8s var(--ease-out)}
.impp-bar b::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:imppSheen 1.9s ease-in-out infinite}
@keyframes imppSheen{to{transform:translateX(100%)}}
/* the galley: a proof sheet the sentences are set onto, newest at the bottom, older ones fading out */
.impp-gal{position:relative;height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 14px 12px;border-radius:5px;background:var(--paper);border:1px dashed var(--rule);font:400 15px/1.6 var(--f-body);color:var(--ink);overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34px);mask-image:linear-gradient(to bottom,transparent 0,#000 34px)}
.impp-gal.st1{justify-content:center;-webkit-mask-image:none;mask-image:none}
.impp-l{display:grid;grid-template-columns:2em 1fr;gap:.35em;margin:0 0 6px;animation:imppIn .5s var(--ease-out) both}
.impp-l:last-child{margin-bottom:0}
.impp-l .ln{font:500 11px/2.15 var(--f-mono);color:var(--ink-3);text-align:right;padding-right:4px;border-right:1px solid var(--rule)}
.impp-cur .tx::after{content:'';display:inline-block;width:2px;height:1.05em;margin-left:2px;background:var(--pencil);vertical-align:-.17em;animation:imppBlink 1s steps(1) infinite}
.impp-cur .ln{color:var(--pencil)}
@keyframes imppBlink{50%{opacity:0}}
@keyframes imppIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.impp-sk{display:block;height:9px;border-radius:3px;margin:9px 0;background:linear-gradient(90deg,var(--paper-2) 0%,var(--sheet) 45%,var(--paper-2) 90%);background-size:220% 100%;animation:imppSk 1.5s ease-in-out infinite}
.impp-sk:nth-child(1){width:94%}.impp-sk:nth-child(2){width:80%;animation-delay:.15s}.impp-sk:nth-child(3){width:62%;animation-delay:.3s}
@keyframes imppSk{from{background-position:120% 0}to{background-position:-120% 0}}
.impp-gal.st3{flex-flow:row wrap;justify-content:flex-start;align-content:flex-end;gap:6px}
.impp-chip{display:inline-flex;align-items:baseline;gap:5px;padding:3px 10px;border-radius:999px;background:var(--sheet);border:1px solid var(--rule);font:400 13px/1.5 var(--f-zh);animation:imppPop .45s var(--ease-spring) both}
.impp-chip b{font:600 13.5px var(--f-body)}
.impp-chip i{font:500 10.5px var(--f-mono);font-style:normal;color:var(--pencil)}
.impp-chip span{color:var(--ink-2)}
@keyframes imppPop{from{opacity:0;transform:translateY(6px) scale(.88)}to{opacity:1;transform:none}}
.impp-gal.st4{align-items:center;justify-content:center;-webkit-mask-image:none;mask-image:none}
.impp-fin{display:flex;align-items:center;gap:12px;margin:0;font:600 17px var(--f-zh);color:var(--ok)}
.impp-fin .tick{width:36px;height:36px;border-radius:50%;background:var(--ok);color:var(--sheet);display:grid;place-items:center;font-size:19px;animation:imppPop .55s var(--ease-spring) both}
.impp-stat{margin:12px 0 2px;font:500 13px/1.6 var(--f-zh);color:var(--ink-2);font-variant-numeric:tabular-nums}
.impp-tip{margin:0;font:400 12.5px/1.6 var(--f-zh);color:var(--ink-3);min-height:1.6em}
@media (max-width:520px){.impp{padding:15px 14px 14px}.impp-steps li{font-size:11.5px}.impp-gal{height:168px;font-size:14.5px}}
@media (prefers-reduced-motion:reduce){.impp *,.impp *::before,.impp *::after{animation:none!important;transition:none!important}}

/* phones: while the answer sheet is up, toasts drop in from the top instead of covering its options */
@media (max-width:1039px){ body:has(#panel.open) .toast{top:calc(14px + env(safe-area-inset-top,0px));bottom:auto} }
/* archive: the 删除 link was a 24-px target on touch screens */
@media (pointer:coarse){ .hm-del{padding:9px 12px;font-size:12px;min-height:34px} }

/* ---------- 正在排版: centred modal (impDialog) ---------- */
html.impp-lock{overflow:hidden}
.impp-ov{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--paper) 58%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.15);backdrop-filter:blur(12px) saturate(1.15);
  opacity:0;transition:opacity .38s var(--ease-out)}
.impp-ov.in{opacity:1}
.impp-ov.out{opacity:0;transition-duration:.42s}
.impp-dlg{width:min(680px,100%);max-height:calc(100dvh - 32px);overflow:auto;outline:none;border-radius:16px;
  box-shadow:0 40px 90px -36px rgba(20,24,27,.55),0 12px 30px -18px rgba(20,24,27,.3);transform:translateY(22px) scale(.965);transition:transform .6s var(--ease-spring)}
.impp-ov.in .impp-dlg{transform:none}
.impp-ov.out .impp-dlg{transform:translateY(-10px) scale(.985);transition:transform .42s var(--ease-out)}
.impp-ov .impp{padding:20px 24px 18px;border-radius:16px;border-color:color-mix(in srgb,var(--rule) 80%,var(--ink));
  margin:0;box-shadow:none}
.impp-gal.top.st2,.impp-gal.top.st3{justify-content:flex-start;align-content:flex-start;-webkit-mask-image:none;mask-image:none}
.impp-mast{position:relative;display:flex;justify-content:space-between;gap:12px;padding-bottom:9px;margin-bottom:16px;border-bottom:3px double var(--ink);
  font:600 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.impp-mast span:first-child{font:400 15px var(--f-mast);letter-spacing:0;text-transform:none;color:var(--ink)}
/* ink travelling along the double rule while work is in progress */
.impp-mast::after{content:'';position:absolute;left:0;bottom:-3px;height:3px;width:22%;background:linear-gradient(90deg,transparent,var(--pencil),transparent);animation:imppInk 2.4s ease-in-out infinite}
.impp.fin .impp-mast::after{animation:none;width:100%;background:var(--ok);transition:width .5s}
@keyframes imppInk{0%{transform:translateX(-30%)}100%{transform:translateX(480%)}}
.impp-ov .impp-hd{margin-bottom:16px}
.impp-hd h3{margin:0;font:700 clamp(1.3rem,4.4vw,1.7rem)/1.25 var(--f-zh);letter-spacing:.01em}
.impp-hd h3.sw{animation:imppSwap .5s var(--ease-out)}
@keyframes imppSwap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.impp-ov .impp-t{font-size:15px;padding:3px 10px;border-radius:999px;background:var(--paper-2);color:var(--ink-2)}
.impp-ov .impp-steps{margin-bottom:16px}
.impp-ov .impp-steps li{font-size:13px}
.impp-ov .impp-bar{height:5px;margin-bottom:16px}
.impp-ov .impp-gal{height:min(36vh,300px);font-size:16px;padding:12px 16px 14px}
.impp.fin .impp-bar b{background:var(--ok)}
.impp-foot{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-top:2px}
.impp-foot .impp-tip{flex:1}
.impp-stop{flex:none;appearance:none;border:1px solid var(--rule);background:transparent;color:var(--ink-2);font:500 13px/1 var(--f-zh);padding:9px 16px;border-radius:999px;cursor:pointer;
  transition:color .2s,border-color .2s,background-color .2s,transform .15s}
.impp-stop:hover{border-color:var(--ink-3);color:var(--ink)}
.impp-stop:active{transform:scale(.96)}
.impp-stop.arm{border-color:var(--red);color:var(--red);background:var(--red-wash);animation:shake .35s}
.impp-gal.st4 .impp-fin{flex-direction:column;gap:12px;font-size:19px}
.impp-gal.st4 .tick{width:52px;height:52px;font-size:26px;box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 40%,transparent);animation:imppPop .55s var(--ease-spring) both,imppGlow 1.2s .3s ease-out}
@keyframes imppGlow{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent)}to{box-shadow:0 0 0 22px transparent}}
@media (max-width:520px){
  .impp-ov{padding:10px}
  .impp-ov .impp,.impp-dlg{border-radius:14px}
  .impp-ov .impp{padding:16px 16px 14px}
  .impp-ov .impp-gal{height:42vh;font-size:15px}
  .impp-mast span:last-child{display:none}
}
@media (prefers-reduced-motion:reduce){.impp-ov,.impp-dlg{transition:none!important}.impp-mast::after{animation:none!important}}
.impp-fin b{font:700 1.05em/1.35 var(--f-head);color:var(--ink);text-align:center;max-width:26em;animation:imppSwap .5s .15s var(--ease-out) both}
.impp-fin small{font:400 13px var(--f-zh);color:var(--ink-3);animation:imppSwap .5s .3s var(--ease-out) both}

.backq{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:19;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:10px 18px;font:500 14px/1.3 var(--f-zh);box-shadow:0 12px 30px rgba(0,0,0,.22);cursor:pointer;white-space:nowrap}

.mqs{margin-top:2.6rem;border-top:3px double var(--ink);padding-top:14px}
.mqs-hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:8px}
.mqs-hd h3{margin:0;font:700 1.3rem/1.2 var(--f-head)}
.mqs-hd h3 span{font:500 13px var(--f-zh);color:var(--ink-3);margin-left:8px}

.mq.on{background:var(--pencil-wash)}

.mq-en{margin:0;font:400 1.08rem/1.7 var(--f-body)}
.mq-zh{margin:4px 0 0;font:400 .9rem/1.7 var(--f-zh);color:var(--ink-2);animation:fadeup .3s var(--ease-out)}
.mq .blank{min-width:3.4em;justify-content:center;margin-top:2px;font-size:1.1rem}

@media (max-width:620px){.mq{grid-template-columns:1.8rem minmax(0,1fr) auto;gap:8px;padding:10px 4px}.mq-en{font-size:1rem}}

.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}

.pchip b{font:700 1.05rem var(--f-head)}

.pchip:hover{border-color:var(--ink);transform:translateY(-2px)}

.lpick b{font:700 1rem var(--f-head)}
.lpick span{font:400 .78rem/1.35 var(--f-body);color:var(--ink-3);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lpick:hover{border-color:var(--ink);transform:translateY(-1px)}

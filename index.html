.mq.mcq .mq-en{font-weight:500}
.mos{list-style:none;margin:8px 0 0 calc(2.2rem + 10px);padding:0;display:grid;gap:3px}
.mo{display:grid;grid-template-columns:1.9rem minmax(0,1fr);align-items:baseline;width:100%;text-align:left;border:1px solid transparent;border-radius:9px;background:none;padding:6px 10px 6px 8px;cursor:pointer;color:var(--ink);font:400 1.02rem/1.6 var(--f-body);transition:background-color .18s,border-color .18s,opacity .25s,transform .14s var(--ease-out)}
.mo b{font:600 .85rem/1.9 var(--f-mono);color:var(--ink-3)}
.mo-t{min-width:0}
.mo-en{display:block}
.mo-zh{display:block;margin-top:1px;font:400 .86rem/1.6 var(--f-zh);color:var(--ink-2);animation:fadeup .3s var(--ease-out)}
.mo:hover{background:var(--pencil-wash)}
.mo:active{transform:scale(.99)}
.mo.chosen{border-color:var(--pencil);background:var(--pencil-wash);box-shadow:inset 3px 0 0 var(--pencil)}
.mo.chosen b{color:var(--pencil)}
.mo.right{border-color:var(--ok);background:var(--ok-wash)}
.mo.right b{color:var(--ok)}
.mo.right .mo-en::after{content:" ✓";color:var(--ok);font-weight:700}
.mo.wrong{border-color:var(--red);background:var(--red-wash)}
.mo.wrong b{color:var(--red)}
.mo.wrong .mo-en{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:1.5px}
.mo.dim{opacity:.55}
.mo.dim:hover{opacity:.85}
.mq.mcq .blank{min-width:2.6em}
.mq.mcq .blank .bw::after{content:none}
@media (max-width:620px){.mos{margin-left:0}.mq-top{grid-template-columns:1.8rem minmax(0,1fr) auto;gap:8px}.mo{font-size:.98rem}}

.mpicks{display:grid;gap:6px;margin-top:10px}
.mpick{display:grid;grid-template-columns:1.8rem minmax(0,1fr);align-items:baseline;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:9px;padding:8px 10px;cursor:pointer;color:var(--ink);font:400 .95rem/1.5 var(--f-body);transition:border-color .2s,background .2s,transform .14s var(--ease-out)}
.mpick b{font:600 .85rem var(--f-mono);color:var(--ink-3)}
.mpick:hover{border-color:var(--ink)}
.mpick.chosen{border-color:var(--pencil);background:var(--pencil-wash);box-shadow:inset 0 0 0 1px var(--pencil)}
.mpick.no{opacity:.45;border-color:var(--red);text-decoration:line-through}
.mpick:active{transform:scale(.98)}

.oxl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.oxl li{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:6px;padding:8px 10px;border-radius:9px;border:1px solid var(--rule)}
.oxl li>b{font:700 .95rem/1.6 var(--f-mono);color:var(--ink-3)}
.oxl li.ok{border-color:var(--ok);background:var(--ok-wash)}
.oxl li.ok>b{color:var(--ok)}
.oxl li.bad{border-color:var(--red);background:var(--red-wash)}
.oxl li.bad>b{color:var(--red)}
.ox-en{margin:0;font:400 .95rem/1.55 var(--f-body)}
.ox-en span{display:block;font:400 .84rem/1.55 var(--f-zh);color:var(--ink-2)}
.ox-why{margin:5px 0 0;font:400 .88rem/1.7 var(--f-zh);color:var(--ink-2)}
.ox-tag{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;font:600 11px/1.6 var(--f-zh);font-style:normal;color:#fff;background:var(--ink-3)}
.ox-tag.ok{background:var(--ok)}
.t-swap{background:var(--pos-v)}
.t-infer{background:var(--pos-adj)}
.t-part{background:var(--pos-n)}
.t-flip{background:var(--red)}

.ed-mcq{display:grid;gap:6px;margin:6px 0 8px}
.ed-mo{display:grid;grid-template-columns:1.4rem repeat(3,minmax(0,1fr));gap:6px;align-items:start}
.ed-mo b{font:700 .9rem/2.2 var(--f-mono);color:var(--ink-3)}
@media (max-width:760px){.ed-mo{grid-template-columns:1.4rem minmax(0,1fr)}.ed-mo>textarea{grid-column:2}}
.ans-big b{white-space:nowrap;flex:none}

/* ===================== 翻译 ===================== */
.tr h3{margin:0 0 10px;font:700 1.3rem/1.2 var(--f-head)}
.tr h3 span{font:500 13px var(--f-zh);color:var(--ink-3);margin-left:8px}
.tr-src{margin-top:22px;padding:18px 20px 16px;background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:2px}
.tr-src-p{margin:0;font:400 1.16rem/2.05 var(--f-zh);text-indent:2em;letter-spacing:.02em;text-align:justify}
.tr-k{display:inline;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;
  text-decoration:underline;text-decoration-color:var(--pencil);text-decoration-thickness:1.5px;text-underline-offset:5px;border-radius:2px;transition:background-color .15s}
.tr-k:hover{background:var(--pencil-wash)}
.tr-k.on{background:var(--marker)}
.tr-hint{margin:10px 0 0;font:400 .85rem var(--f-zh);color:var(--ink-3)}

.tr-work{margin-top:26px}
.tr-work header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tr-wc{font:500 12px var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.tr-in{display:block;width:100%;min-height:15rem;resize:vertical;padding:16px 18px;border:1.5px solid var(--ink);border-radius:4px;
  background:var(--sheet) repeating-linear-gradient(180deg,transparent 0 33px,var(--rule) 33px 34px);background-attachment:local;background-position:0 15px;
  color:var(--ink);font:400 1.1rem/34px var(--f-body);transition:border-color .2s,box-shadow .2s}
.tr-in:focus{outline:none;border-color:var(--pencil);box-shadow:0 0 0 3px var(--pencil-wash)}
.tr-in::placeholder{font:400 .95rem/34px var(--f-zh);color:var(--ink-3)}
.tr-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tr-act .spin{border-top-color:var(--paper)}

.tr-rev{margin-top:28px;padding:18px 20px;border:1.5px solid var(--ink);border-radius:16px;background:var(--sheet);animation:viewin .5s var(--ease-out) both}
.tr-score{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:6px 16px}
.tr-ring{width:64px;height:64px;transform:rotate(-90deg)}
.tr-ring circle{fill:none;stroke-width:5}
.tr-ring .rt{stroke:var(--rule)}
.tr-ring .rf{stroke:var(--pencil);stroke-linecap:round;animation:trring 1.1s var(--ease-out) both}
@keyframes trring{from{stroke-dashoffset:163.4}}
.tr-score>div:nth-child(2){display:flex;align-items:baseline;gap:4px}
.tr-score>div:nth-child(2) b{font:700 2.6rem/1 var(--f-head)}
.tr-score>div:nth-child(2) span{font:500 14px var(--f-mono);color:var(--ink-3)}
.tr-band i{display:inline-block;font-style:normal;font:600 12px/1.6 var(--f-zh);padding:0 8px;border-radius:999px;background:var(--pencil-wash);color:var(--pencil)}
.tr-band p{margin:4px 0 0;font:400 .95rem/1.7 var(--f-zh);color:var(--ink-2)}
.tr-good{margin:0;padding-left:1.2em;font:400 .93rem/1.8 var(--f-zh);color:var(--ink-2)}
.tr-fix{list-style:none;margin:0;padding:0;counter-reset:f;display:grid;gap:10px}
.tr-fix li{counter-increment:f;position:relative;padding:10px 12px 10px 36px;border-radius:10px;background:var(--paper)}
.tr-fix li::before{content:counter(f);position:absolute;left:12px;top:11px;font:600 12px var(--f-mono);color:var(--ink-3)}
.tr-orig{margin:0;font:400 .98rem/1.6 var(--f-body);color:var(--red);text-decoration:line-through;text-decoration-thickness:1px}
.tr-better{margin:4px 0 0;font:500 1rem/1.6 var(--f-body);color:var(--ok)}
.tr-why{margin:4px 0 0;font:400 .88rem/1.7 var(--f-zh);color:var(--ink-2)}
.tr-pol{margin:0;padding:12px 14px;border-left:3px solid var(--pencil);background:var(--pencil-wash);font:400 1.02rem/1.85 var(--f-body)}

.tr-ref{margin-top:32px;border-top:3px double var(--ink);padding-top:14px;animation:viewin .45s var(--ease-out) both}
.tr-pairs{list-style:none;margin:0;padding:0;counter-reset:tp;display:grid;gap:4px}
.tr-pair{counter-increment:tp;position:relative;padding:12px 0 14px 2.4rem;border-bottom:1px solid var(--rule)}
.tr-pair::before{content:counter(tp);position:absolute;left:0;top:14px;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ink-3);font:600 11px var(--f-mono);color:var(--ink-2)}
.tr-zh{margin:0;font:400 1rem/1.9 var(--f-zh);color:var(--ink-2)}
.tr-en{margin:6px 0 0;font-size:1.12rem;line-height:1.85}
.tr-exprs{margin-top:28px}
.tr-exprs ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tr-x{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;height:100%;text-align:left;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px;cursor:pointer;transition:border-color .2s,transform .2s var(--ease-out)}
.tr-x b{font:600 .98rem/1.5 var(--f-zh);color:var(--ink)}
.tr-x span{font:400 1rem/1.45 var(--f-body);color:var(--pencil)}
.tr-x:hover{border-color:var(--pencil);transform:translateY(-2px)}
.tr-ezh{margin:12px 0 2px;font:700 1.5rem/1.4 var(--f-zh)}
.tr-een{margin:0 0 6px;font:600 1.3rem/1.4 var(--f-body);color:var(--pencil)}
@media (max-width:620px){.tr-src{padding:14px 14px}.tr-src-p{font-size:1.08rem}.tr-score{grid-template-columns:auto auto}.tr-band{grid-column:1 / -1}}

/* ===================== 往期报亭 ===================== */
:root{
  --np:#f8f6ee; --np-ink:#1b1f22; --crease:rgba(20,24,27,.075); --crease-hi:rgba(255,255,255,.75); --np-sh:rgba(20,24,27,.34);
  --rod:#8e979d; --rod-hi:#e2e6e8; --rod-lo:#59626a; --rod-sh:rgba(20,24,27,.08); --brk:#4f585f;
  --peg:#d3ae75; --peg-hi:#ecd2a4; --peg-lo:#a5814f; --stamp-blend:multiply;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --np:#1f252c; --crease:rgba(0,0,0,.32); --crease-hi:rgba(255,255,255,.045); --np-sh:rgba(0,0,0,.65);
    --rod:#6c757c; --rod-hi:#b3bbc0; --rod-lo:#353d43; --rod-sh:rgba(0,0,0,.28); --brk:#454e55;
    --peg:#a3825a; --peg-hi:#c4a376; --peg-lo:#735a3c; --stamp-blend:normal;
  }
}
:root[data-theme="dark"]{
  --np:#1f252c; --crease:rgba(0,0,0,.32); --crease-hi:rgba(255,255,255,.045); --np-sh:rgba(0,0,0,.65);
  --rod:#6c757c; --rod-hi:#b3bbc0; --rod-lo:#353d43; --rod-sh:rgba(0,0,0,.28); --brk:#454e55;
  --peg:#a3825a; --peg-hi:#c4a376; --peg-lo:#735a3c; --stamp-blend:normal;
}

.stand{--ph:318px;--rg:30px;--per:calc(var(--ph) + 52px + var(--rg))}
@media (max-width:620px){.stand{--ph:252px;--rg:26px}}

/* day divider */
.shelf{margin-top:38px}
.shelf:first-of-type{margin-top:6px}
.day{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.day-n{font:700 clamp(2.5rem,6vw,3.3rem)/.82 var(--f-head);font-variant-numeric:lining-nums;letter-spacing:-.02em}
.day-t{display:flex;flex-direction:column;gap:5px;white-space:nowrap}
.day-t>span{display:flex;align-items:center;gap:8px;font:600 14px/1 var(--f-zh)}
.day-t em{font:600 11px/1 var(--f-zh);font-style:normal;padding:3px 8px;border-radius:999px;background:var(--ink);color:var(--paper)}
.day-t small{font:500 11px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.16em}
.day-rule{flex:1;min-width:20px;height:5px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);opacity:.75}
.day-c{font:500 12px var(--f-mono);color:var(--ink-3);white-space:nowrap}

/* the rack: one rod per grid row, drawn as a repeating gradient so every row gets its own bar */
.rack{position:relative;padding:0 16px;
  background:repeating-linear-gradient(180deg,transparent 0 9px,var(--rod-hi) 9px 10.5px,var(--rod) 10.5px 13.5px,var(--rod-lo) 13.5px 15px,var(--rod-sh) 15px 20px,transparent 20px var(--per))}
.rack::before,.rack::after{content:"";position:absolute;top:0;bottom:0;width:9px;
  background:repeating-linear-gradient(180deg,transparent 0 4px,var(--brk) 4px 24px,transparent 24px var(--per))}
.rack::before{left:0;border-radius:2px}
.rack::after{right:0;border-radius:2px}
.hangs{display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));grid-auto-rows:calc(var(--ph) + 52px);row-gap:var(--rg);column-gap:0}
@media (max-width:620px){.rack{padding:0 11px}.hangs{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}}

.hang{position:relative;min-width:0;padding:18px 12px 0;container-type:inline-size;display:flex;flex-direction:column}
@media (max-width:620px){.hang{padding:18px 7px 0}}

/* a folded front page */
.np{appearance:none;-webkit-appearance:none;position:relative;display:flex;flex-direction:column;width:100%;height:var(--ph);box-sizing:border-box;
  margin:0;padding:12px 11px 10px;border:0;border-radius:2px 2px 3px 3px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;
  background:
    linear-gradient(180deg,transparent 47.6%,var(--crease) 48.1%,var(--crease-hi) 48.7%,transparent 49.6%),
    linear-gradient(98deg,transparent 60%,rgba(0,0,0,.025)),
    var(--np);
  box-shadow:0 1px 1px rgba(20,24,27,.08),0 14px 22px -14px var(--np-sh),inset 0 0 0 1px rgba(127,127,127,.12);
  transform-origin:50% -8px;transform:rotate(var(--t));
  transition:box-shadow .3s var(--ease-out)}
.np:focus-visible{outline:2px solid var(--pencil);outline-offset:4px}
@media (hover:hover){
  .np:hover{animation:sway 1.4s ease-in-out forwards;box-shadow:0 1px 1px rgba(20,24,27,.08),0 22px 30px -14px var(--np-sh),inset 0 0 0 1px rgba(127,127,127,.14)}
  .hm-del{opacity:0;transition:opacity .2s}
  .hang:hover .hm-del,.hang:focus-within .hm-del,.hm-del.sure{opacity:1}
}
.np.take{animation:take .26s ease-in forwards!important}
@keyframes sway{
  0%{transform:rotate(var(--t))}
  24%{transform:translateY(-3px) rotate(calc(var(--t) - 1.7deg))}
  52%{transform:translateY(-3px) rotate(calc(var(--t) + 1.1deg))}
  78%{transform:translateY(-3px) rotate(calc(var(--t) - .45deg))}
  100%{transform:translateY(-3px) rotate(var(--t))}}
@keyframes take{to{opacity:0;transform:translateY(-30px) rotate(0deg) scale(1.06)}}

.peg{position:absolute;top:-13px;z-index:2;width:9px;height:27px;border-radius:2px 2px 3px 3px;
  background:linear-gradient(90deg,var(--peg-lo),var(--peg) 35%,var(--peg-hi) 55%,var(--peg-lo));box-shadow:0 3px 4px -1px rgba(0,0,0,.28)}
.peg::after{content:"";position:absolute;left:-2px;right:-2px;top:10px;height:3px;border-radius:2px;background:linear-gradient(180deg,var(--rod-hi),var(--rod-lo))}
.peg.l{left:21%}.peg.r{right:21%}

.np-rib{position:absolute;top:92px;right:-10px;z-index:3;display:block;width:21px;box-sizing:border-box;padding:7px 2px 7px 6px;text-align:center;
  font:600 10px/1.45 var(--f-zh);color:#fff;border-radius:0 3px 3px 0;
  background:linear-gradient(90deg,color-mix(in srgb,var(--pencil) 72%,transparent) 0 9px,var(--pencil) 9px);box-shadow:2px 2px 4px -1px rgba(0,0,0,.25)}
@media (max-width:620px){.np-rib{right:-7px;top:74px;width:18px;padding:6px 1px 6px 5px;font-size:9px}}

.np-mast{display:block;text-align:center;white-space:nowrap;overflow:hidden;padding-bottom:5px;border-bottom:1px solid currentColor;
  font:400 clamp(1rem,10.6cqw,1.55rem)/1.05 var(--f-mast)}
.np-line{display:flex;justify-content:space-between;gap:4px;padding:4px 0 5px;border-bottom:3px double currentColor;
  font:500 clamp(6.5px,3.5cqw,9.5px)/1 var(--f-mono);letter-spacing:.05em;color:var(--ink-3);white-space:nowrap}
.np-kick{display:block;margin-top:9px;font:600 clamp(7px,3.7cqw,10px)/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.np-hl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:5px;
  font:700 clamp(.95rem,8.3cqw,1.34rem)/1.12 var(--f-head);text-wrap:balance}
.np-zh{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:500 clamp(9px,4.6cqw,12.5px)/1.4 var(--f-zh);color:var(--ink-2)}
.np-cols{display:block;flex:1 1 0;min-height:0;overflow:hidden;margin-top:8px;padding-top:7px;border-top:1px solid var(--rule);
  column-count:2;column-gap:9px;column-rule:1px solid var(--rule);column-fill:auto;
  font:400 clamp(5.8px,3.05cqw,8.3px)/1.45 var(--f-body);color:var(--ink-3);text-align:justify;hyphens:auto;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.np-cols::first-letter{float:left;font:700 3.1em/.82 var(--f-head);color:var(--ink);padding:1px 2px 0 0}
.np-foot{display:block;margin-top:6px}
.np-bar{display:block;height:2px;background:var(--rule);border-radius:2px;overflow:hidden}
.np-bar i{display:block;height:100%;background:var(--ink);transform-origin:left}
.np-fm{display:flex;justify-content:space-between;gap:6px;margin-top:5px;white-space:nowrap;font:500 clamp(7px,3.7cqw,10px)/1 var(--f-mono);color:var(--ink-2)}

.np-stamp{position:absolute;right:9px;bottom:32px;z-index:2;display:grid;place-content:center;justify-items:center;gap:1px;
  width:clamp(46px,28cqw,64px);aspect-ratio:1;border-radius:50%;color:var(--red);
  border:2px solid currentColor;box-shadow:inset 0 0 0 2px var(--np),inset 0 0 0 3.5px currentColor;
  background:color-mix(in srgb,var(--np) 55%,transparent);
  transform:rotate(-14deg);opacity:.86;mix-blend-mode:var(--stamp-blend)}
.np-stamp b{font:700 clamp(.8rem,8cqw,1.12rem)/1 var(--f-head)}
.np-stamp i{font:600 clamp(6.5px,3.3cqw,8.5px)/1 var(--f-zh);font-style:normal;letter-spacing:.1em}
.np-stamp.done{color:var(--ok)}
.np-stamp.low{color:var(--ink-2)}

.hang-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;height:26px;margin-top:8px;padding:0 2px;
  font:500 11px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.hm-del{appearance:none;border:0;background:none;font:500 11px var(--f-zh);color:var(--ink-3);padding:4px 7px;border-radius:7px;cursor:pointer}
.hm-del:hover,.hm-del:focus-visible{color:var(--red);background:var(--red-wash)}
.hm-del.sure{color:var(--red);background:var(--red-wash);animation:shake .35s}

/* arrival: the papers drop onto the rod and swing to rest */
.stand.swing .day{animation:fadeup .5s var(--ease-out) both}
.stand.swing .day-rule{animation:rulein .9s var(--ease-out) .1s both}
.stand.swing .rack{animation:fadein .35s both}
.stand.swing .np{animation:hangin 1.3s ease-in-out var(--d) both}
.stand.swing .hang-meta{animation:fadein .5s calc(var(--d) + .5s) both}
.stand.swing .np-bar i{animation:grow .8s var(--ease-out) calc(var(--d) + .7s) both}
.stand.swing .np-stamp{animation:npstamp .42s cubic-bezier(.2,.9,.3,1.2) calc(var(--d) + 1s) both}
.stand.swing .np-rib{animation:flagin .5s var(--ease-spring) calc(var(--d) + .95s) both}
@keyframes flagin{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes hangin{
  0%{opacity:0;transform:translateY(-36px) rotate(calc(var(--t) + 8deg))}
  22%{opacity:1;transform:translateY(0) rotate(calc(var(--t) - 6deg))}
  44%{transform:rotate(calc(var(--t) + 3.4deg))}
  64%{transform:rotate(calc(var(--t) - 1.7deg))}
  82%{transform:rotate(calc(var(--t) + .6deg))}
  100%{transform:rotate(var(--t))}}
@keyframes npstamp{from{opacity:0;transform:rotate(-14deg) scale(2.3)}to{opacity:.86;transform:rotate(-14deg) scale(1)}}

/* tab bar scroll cues: edge fades + chevrons when more tabs sit off-screen */
.tabs-shell{position:relative}
.tabs-fade{position:absolute;top:3px;bottom:1px;width:44px;display:flex;align-items:center;border:0;padding:0;margin:0;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s;z-index:2;color:var(--pencil)}
.tabs-fade.l{left:0;justify-content:flex-start;padding-left:2px;background:linear-gradient(90deg,var(--paper) 35%,transparent)}
.tabs-fade.r{right:0;justify-content:flex-end;padding-right:2px;background:linear-gradient(270deg,var(--paper) 35%,transparent)}
.tabs-fade svg{width:16px;height:16px}
.tabs-shell.can-l .tabs-fade.l,.tabs-shell.can-r .tabs-fade.r{opacity:1;pointer-events:auto}
.tabs-shell.can-r .tabs-fade.r svg{animation:nudge 1.6s ease-in-out 3}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
/* overscroll: past either end the row squeezes into the far wall, then springs back */
.tabs{overscroll-behavior-x:contain}
.tabs>*{translate:var(--tx,0px) 0;scale:var(--sx,1) 1}
.tabs.pulling>*{transition:none!important}
.tabs.spring>*{transition:translate .62s var(--ease-spring),scale .62s var(--ease-spring),transform .5s var(--ease-spring),width .45s var(--ease-out),opacity .2s,color .2s!important}
.tabs-glow{position:absolute;top:3px;bottom:1px;width:16px;pointer-events:none;opacity:0;z-index:3;transform:scaleY(.4);transition:opacity .45s,transform .55s var(--ease-spring)}
.tabs-glow.l{left:0;background:radial-gradient(farthest-side at 0 50%,var(--pencil),transparent)}
.tabs-glow.r{right:0;background:radial-gradient(farthest-side at 100% 50%,var(--pencil),transparent)}
.tabs-shell.pulling .tabs-glow{transition:none}
/* press feedback on tabs */
.tab{transform-origin:50% 60%}
.tab:active{transform:scale(.94)}
.tabs:not(.pulling):not(.spring) .tab{transition:color .2s,transform .18s var(--ease-out)}
.tabs-fade:active svg{transform:scale(.8)}

/* ===================== 词典：一本可以召唤的精装词典 ===================== */
:root{
  --cover:#1f2d5c; --cover-hi:#30437f; --cover-lo:#121a38; --gold:#c6a35a; --gold-2:#ead39b;
  --gutter:rgba(20,24,27,.13); --leaf-shade:rgba(20,24,27,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --cover:#1b2550; --cover-hi:#2a3a72; --cover-lo:#0d1330; --gold:#b39150; --gold-2:#d9c088; --gutter:rgba(0,0,0,.45); --leaf-shade:rgba(0,0,0,.4); }
}
:root[data-theme="dark"]{ --cover:#1b2550; --cover-hi:#2a3a72; --cover-lo:#0d1330; --gold:#b39150; --gold-2:#d9c088; --gutter:rgba(0,0,0,.45); --leaf-shade:rgba(0,0,0,.4); }
html{touch-action:manipulation}
html.dk-lock{overflow:hidden}

/* ---------- overlay ---------- */
.dk-ov{position:fixed;inset:0;z-index:60}
.dk-ov::before{content:"";position:absolute;inset:0;background:rgba(12,16,20,.34);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadein .35s both}
.dk-ov.closing::before{animation:dkfade .45s .3s both}
@keyframes dkfade{to{opacity:0}}
.dk-x{position:absolute;top:-6px;right:-6px;z-index:8;width:38px;height:38px;border-radius:999px;border:1.5px solid var(--gold);background:var(--cover);color:var(--gold-2);font:300 24px/1 var(--f-mono);cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .2s var(--ease-spring)}
.dk-x:hover{transform:rotate(90deg) scale(1.06)}
.dbook.opening .dk-x,.dbook.closing .dk-x{opacity:0}

/* ---------- the book ---------- */
.dbook{position:relative;perspective:2600px;--bw:10px}
.dbook.ov{position:absolute;left:50%;top:50%;width:min(1080px,calc(100vw - 40px));height:min(740px,calc(100vh - 56px));transform:translate(-50%,-50%)}
.dbook.page{height:clamp(560px,calc(100vh - 200px),880px);margin:18px 34px 8px 12px}
.dk-board{position:absolute;inset:calc(var(--bw) * -1) calc(var(--bw) * -1) calc(var(--bw) * -1 - 3px);border-radius:12px;
  background:radial-gradient(120% 90% at 30% 20%,var(--cover-hi),transparent 60%),radial-gradient(90% 80% at 80% 90%,var(--cover-lo),transparent 70%),var(--cover);
  box-shadow:0 34px 70px -28px rgba(0,0,0,.55),0 3px 0 var(--cover-lo),inset 0 0 0 1px rgba(255,255,255,.06)}
.dk-spread{position:relative;height:100%;display:grid;grid-template-columns:1fr 1fr;perspective:2600px}
.dk-spread::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:30px;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--gutter) 46%,rgba(0,0,0,.18) 50%,var(--gutter) 54%,transparent);opacity:.55}
.dk-page{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--sheet);overflow:hidden;
  background-image:linear-gradient(0deg,rgba(127,127,127,.025) 1px,transparent 1px);background-size:100% 3px}
.dk-l{border-radius:5px 0 0 5px;padding:18px 26px 16px 28px;
  box-shadow:inset -34px 0 36px -30px var(--gutter),-1px 0 0 var(--rule),-3px 1px 0 var(--sheet),-4px 1px 0 var(--rule),-6px 2px 0 var(--sheet),-7px 2px 0 var(--rule)}
.dk-r{border-radius:0 5px 5px 0;
  box-shadow:inset 34px 0 36px -30px var(--gutter),1px 0 0 var(--rule),3px 1px 0 var(--sheet),4px 1px 0 var(--rule),6px 2px 0 var(--sheet),7px 2px 0 var(--rule)}
.dk-scroll{height:100%;overflow:auto;overscroll-behavior:contain;padding:18px 30px 28px 34px}
.dk-run{display:flex;justify-content:space-between;gap:10px;font:500 10.5px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:12px}
.dk-run span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-list::-webkit-scrollbar,.dk-scroll::-webkit-scrollbar{width:10px;background:transparent}
.dk-list::-webkit-scrollbar-thumb,.dk-scroll::-webkit-scrollbar-thumb{background-color:var(--sb);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.dk-list::-webkit-scrollbar-button,.dk-scroll::-webkit-scrollbar-button{display:none}
@supports not selector(::-webkit-scrollbar){.dk-list,.dk-scroll{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}}

/* ---------- left page: search ---------- */
.dk-search{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding:2px 2px 8px;margin-bottom:10px;transition:border-color .2s}
.dk-search:focus-within{border-bottom-color:var(--pencil)}
.dk-search svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.dk-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 1.55rem/1.25 var(--f-body);padding:4px 0;outline:none;-webkit-appearance:none;appearance:none}
.dk-search input::placeholder{font:400 1rem var(--f-zh);color:var(--ink-3)}
.dk-search input::-webkit-search-cancel-button{-webkit-appearance:none}
.dk-search input:focus-visible{outline:none}
.dk-list{flex:1;min-height:0;overflow:auto;margin:0 -10px;padding:2px 10px 6px}
.dk-lh{display:block;margin:14px 0 6px;font:600 10.5px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.dk-items{list-style:none;margin:0;padding:0}
.dk-it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:baseline;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:8px;cursor:pointer;color:var(--ink);transition:background-color .15s}
.dk-it b{font:700 1.08rem/1.3 var(--f-head);white-space:nowrap}
.dk-it span{font:400 .88rem/1.4 var(--f-zh);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-it i{font-style:normal}
.dk-it:hover,.dk-it.on{background:var(--pencil-wash)}
.dk-it.on{box-shadow:inset 3px 0 0 var(--pencil)}
.dk-tip{margin:16px 0 0;font:400 .85rem/1.7 var(--f-zh);color:var(--ink-3)}
.dk-tip b{color:var(--ink-2)}
kbd{display:inline-block;min-width:1.5em;padding:0 5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;font:600 .8rem/1.5 var(--f-mono);text-align:center;color:var(--ink-2);background:var(--paper)}
.dk-wod{margin-top:8px;padding:12px 14px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--paper);position:relative}
.dk-wod .dk-lh{margin:0 0 2px}
.dk-wod-w{display:block;border:0;background:none;padding:0;font:700 1.9rem/1.15 var(--f-head);color:var(--ink);cursor:pointer;text-align:left}
.dk-wod-w:hover{color:var(--pencil)}
.dk-wod p{margin:4px 0 0;font:400 .92rem/1.6 var(--f-zh);color:var(--ink-2)}
.dk-hist{display:flex;flex-wrap:wrap;gap:6px}
.dk-hist button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 11px;font:400 .95rem/1.4 var(--f-body);color:var(--ink);cursor:pointer;transition:border-color .2s,transform .14s var(--ease-out)}
.dk-hist button:hover{border-color:var(--pencil);color:var(--pencil)}
.dk-hist .dk-clr{border-style:dashed;color:var(--ink-3);font:400 .82rem/1.6 var(--f-zh)}
.dk-az{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.dk-az button{aspect-ratio:1;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font:700 1rem var(--f-head);color:var(--ink-2);cursor:pointer;transition:all .18s var(--ease-out)}
.dk-az button:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-2px)}
.dk-lhd{display:flex;align-items:baseline;gap:12px;margin:4px 0 6px;font:400 .85rem var(--f-zh);color:var(--ink-3)}
.dk-lhd .more{padding:0}
.dk-big{font:700 2.4rem/1 var(--f-head);color:var(--ink)}
.dk-more{width:100%;margin-top:10px}
.dk-nf{font:400 1rem/1.7 var(--f-zh);color:var(--ink-2)}

/* ---------- right page: entry ---------- */
.dk-back{display:block;padding:0 0 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.dk-hw{margin:0;font:700 clamp(2rem,3.4vw,2.85rem)/1.05 var(--f-head);overflow-wrap:anywhere;letter-spacing:-.005em}
.dk-phon{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dk-say{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;background:none;padding:4px 11px 4px 10px;font:400 1rem var(--f-body);color:var(--ink-2);cursor:pointer;transition:border-color .2s,color .2s}
.dk-say i{font:600 .78rem var(--f-zh);font-style:normal;color:var(--pencil)}
.dk-say svg{width:15px;height:15px;color:var(--ink-3)}
.dk-say:hover{border-color:var(--pencil);color:var(--ink)}
.dk-say:hover svg{color:var(--pencil)}
.dk-say:active svg{animation:dkwave .5s}
@keyframes dkwave{40%{transform:scale(1.25)}}
.dk-act{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin-top:14px}
.dk-st{flex:1 1 240px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dk-ex{display:flex;flex-wrap:wrap;gap:6px}
.dk-ex button{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);padding:3px 9px;font:400 1rem var(--f-body);color:var(--ink);cursor:pointer}
.dk-ex button i{font:500 10.5px var(--f-zh);font-style:normal;color:var(--ink-3)}
.dk-ex button:hover{border-color:var(--pencil)}
.dk-cites{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dk-cites button{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--rule);background:none;padding:6px 10px;font:400 .98rem/1.65 var(--f-body);color:var(--ink-2);cursor:pointer;transition:border-color .2s,background .2s}
.dk-cites button:hover{border-left-color:var(--pencil);background:var(--pencil-wash)}
.dk-cites mark{background:var(--marker);color:var(--ink);border-radius:2px;padding:0 1px}
.dk-cites small{display:block;margin-top:2px;font:500 11px var(--f-mono);color:var(--ink-3)}
.dk-links{display:flex;flex-wrap:wrap;gap:6px 14px}
.dk-links a{font:500 13px/1.7 var(--f-zh);color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.dk-links a:hover{color:var(--pencil);text-decoration-color:var(--pencil)}
.dk-src{margin:22px 0 0;padding-top:10px;border-top:1px dashed var(--rule);font:400 11.5px/1.75 var(--f-zh);color:var(--ink-3)}
.dk-src b{font-weight:600;color:var(--ink-2)}
.dk-scroll .xsec{margin-top:6px;border-top:0;padding-top:0}
.dk-scroll .p-sec{margin-top:20px}
/* title page */
.dk-title{display:flex;flex-direction:column;align-items:center;text-align:center;padding:9% 4% 0;gap:6px}
.dk-title .dk-cf-top{font:600 11px var(--f-mono);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.dk-title>b{font:400 clamp(2.6rem,5vw,3.6rem)/1.05 var(--f-mast);color:var(--ink)}
.dk-tz{font:600 .95rem var(--f-zh);letter-spacing:.2em;color:var(--ink-2);padding-bottom:14px;border-bottom:3px double var(--ink);margin-bottom:14px}
.dk-title ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;text-align:left;max-width:27rem}
.dk-title li{font:400 .9rem/1.65 var(--f-zh);color:var(--ink-2);padding-left:20px;position:relative}
.dk-title li::before{content:"❧";position:absolute;left:0;color:var(--pencil)}

/* thumb index cut into the page edge */
.dk-thumbs{position:absolute;top:56px;bottom:22px;right:-31px;width:24px;display:flex;flex-direction:column;gap:1px;z-index:1}
.dk-thumbs button{flex:1;min-height:0;border:0;border-radius:0 6px 6px 0;padding:0;cursor:pointer;font:700 9px/1 var(--f-mono);color:var(--ink-2);
  background:linear-gradient(90deg,rgba(0,0,0,.06),transparent 40%),var(--paper-2);box-shadow:1px 0 0 var(--rule);transition:transform .2s var(--ease-out),background-color .2s,color .2s}
.dk-thumbs button:nth-child(odd){background-color:var(--sheet)}
.dk-thumbs button:hover{transform:translateX(4px);color:var(--ink)}
.dk-thumbs button.on{background:var(--ink);color:var(--paper);transform:translateX(5px)}

/* ---------- cover ---------- */
.dk-cover{position:absolute;top:calc(var(--bw) * -1);bottom:calc(var(--bw) * -1 - 3px);left:50%;right:calc(var(--bw) * -1);transform-origin:0 50%;transform-style:preserve-3d;z-index:6;pointer-events:none;display:none}
.dbook.opening .dk-cover,.dbook.closing .dk-cover{display:block}
.dk-cf,.dk-cb{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:3px 12px 12px 3px}
.dk-cf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--gold-2);text-align:center;
  background:radial-gradient(120% 90% at 30% 20%,var(--cover-hi),transparent 60%),radial-gradient(90% 80% at 80% 90%,var(--cover-lo),transparent 70%),var(--cover);
  box-shadow:inset 0 0 0 14px var(--cover),inset 0 0 0 15px var(--gold),inset 0 0 0 19px var(--cover),inset 0 0 0 20px var(--gold),0 20px 40px -20px rgba(0,0,0,.5)}
.dk-cf::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(255,255,255,.06) 70%,transparent)}
.dk-cf-top{font:600 11px/1 var(--f-mono);letter-spacing:.32em;text-transform:uppercase;opacity:.85}
.dk-cf>b{font:400 clamp(2.4rem,5vw,4.2rem)/1 var(--f-mast);color:var(--gold-2);text-shadow:0 1px 0 rgba(0,0,0,.4)}
.dk-cf-zh{font:600 .95rem var(--f-zh);letter-spacing:.3em;opacity:.9}
.dk-cf-orn{font-size:1.6rem;opacity:.8}
.dk-cf-bot{font:500 10px var(--f-mono);letter-spacing:.24em;opacity:.7}
.dk-cb{transform:rotateY(180deg);border-radius:12px 3px 3px 12px;background:repeating-linear-gradient(45deg,var(--pencil-wash) 0 6px,transparent 6px 12px),var(--sheet);box-shadow:inset 0 0 0 10px var(--cover),inset -30px 0 30px -20px var(--gutter)}

/* opening: the closed book flies out from where you double-clicked, then the cover swings open */
.dbook.ov.opening{animation:dkfly 1.15s cubic-bezier(.22,.8,.25,1) both}
.dbook.page.opening{animation:dkshift 1.15s cubic-bezier(.22,.8,.25,1) both}
.dbook.opening .dk-cover{animation:dkcover 1.15s cubic-bezier(.5,.05,.3,1) both}
.dbook.opening :is(.dk-l,.dk-thumbs){animation:dkleft 1.15s both}
.dbook.opening .dk-board{animation:dkboard 1.15s both}
.dbook.ov.closing{animation:dkfly .76s cubic-bezier(.5,0,.6,.4) reverse both}
.dbook.closing .dk-cover{animation:dkcover .76s cubic-bezier(.5,.05,.3,1) reverse both}
.dbook.closing :is(.dk-l,.dk-thumbs){animation:dkleft .76s reverse both}
.dbook.closing .dk-board{animation:dkboard .76s reverse both}
@keyframes dkfly{
  0%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px))) scale(.14) rotate(-10deg) translateX(-25%)}
  38%{opacity:1;transform:translate(-50%,-50%) scale(.97) rotate(0) translateX(-25%)}
  46%{transform:translate(-50%,-50%) scale(1) translateX(-25%)}
  100%{opacity:1;transform:translate(-50%,-50%) translateX(0)}}
@keyframes dkshift{
  0%{opacity:0;transform:translateX(-25%) translateY(22px) scale(.96)}
  34%{opacity:1;transform:translateX(-25%)}
  46%{transform:translateX(-25%)}
  100%{transform:none}}
@keyframes dkcover{0%,44%{transform:rotateY(0)}92%,100%{transform:rotateY(-180deg)}}
.dbook.opening .dk-cb{animation:dkcbfade 1.15s both}
.dbook.closing .dk-cb{animation:dkcbfade .76s reverse both}
@keyframes dkcbfade{0%,90%{opacity:1}100%{opacity:0}}
@keyframes dkleft{0%,72%{opacity:0}86%,100%{opacity:1}}
@keyframes dkboard{0%,80%{clip-path:inset(0 0 0 50%)}92%,100%{clip-path:inset(0)}}

/* ---------- page turn ---------- */
.dk-leaf{position:absolute;top:0;bottom:0;left:50%;width:50%;transform-origin:0 50%;transform-style:preserve-3d;z-index:4;pointer-events:none}
.dk-leaf.fwd{animation:dkturn .78s cubic-bezier(.45,.05,.3,1) both}
.dk-leaf.bwd{animation:dkturnb .78s cubic-bezier(.45,.05,.3,1) both}
@keyframes dkturn{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
@keyframes dkturnb{0%{transform:rotateY(-180deg)}100%{transform:rotateY(0)}}
.dk-lf,.dk-lb{position:absolute;inset:0;overflow:hidden;background:var(--sheet);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.dk-lf{border-radius:0 5px 5px 0;box-shadow:inset 34px 0 36px -30px var(--gutter)}
.dk-lf .dk-scroll{overflow:hidden}
.dk-lb{transform:rotateY(180deg);border-radius:5px 0 0 5px;box-shadow:inset -34px 0 36px -30px var(--gutter);background-image:linear-gradient(0deg,rgba(127,127,127,.025) 1px,transparent 1px);background-size:100% 3px}
.dk-shade{position:absolute;inset:0;pointer-events:none;opacity:0;animation:dkshade .78s both}
.dk-lf .dk-shade{background:linear-gradient(90deg,transparent 30%,var(--leaf-shade))}
.dk-lb .dk-shade{background:linear-gradient(270deg,transparent 30%,var(--leaf-shade))}
@keyframes dkshade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.dk-under{position:absolute;inset:0;z-index:3;background:var(--sheet);box-shadow:inset 34px 0 36px -30px var(--gutter)}

/* ---------- small screens: a single page ---------- */
@media (max-width:899px){ .dk-thumbs{display:none} .dbook.page{margin-right:12px} }
@media (max-width:759px){
  .dbook.ov{width:calc(100vw - 24px);height:calc(100vh - 36px);height:calc(100dvh - 36px)}
  .dbook.page{height:calc(100vh - 170px);height:calc(100dvh - 170px);min-height:520px;margin:14px 8px 4px}
  .dk-spread{display:flex;flex-direction:column}
  .dk-spread::after{display:none}
  .dk-l{flex:none;border-radius:5px 5px 0 0;box-shadow:none;padding:14px 18px 4px}
  .dk-l .dk-run,.dk-l .dk-list{display:none}
  .dk-r{flex:1;border-radius:0 0 5px 5px;box-shadow:none}
  .dbook.listing .dk-l{flex:1}
  .dbook.listing .dk-l .dk-list{display:block}
  .dbook.listing .dk-r{display:none}
  .dk-scroll{padding:6px 18px 24px}
  .dk-search input{font-size:1.3rem}
  .dk-az{grid-template-columns:repeat(7,minmax(0,1fr))}
  .dk-leaf{left:0;width:100%}
  .dk-lf{border-radius:0 0 5px 5px}
  .dk-cover{left:calc(var(--bw) * -1)}
  .dbook.ov.opening{animation-name:dkfly1}
  .dbook.ov.closing{animation-name:dkfly1}
  .dbook.page.opening{animation-name:dkshift1}
  .dbook.opening .dk-board,.dbook.closing .dk-board{animation:none}
  .dbook.opening .dk-l,.dbook.closing .dk-l{animation:dkleft1 1.15s both}
  .dbook.closing .dk-l{animation-duration:.76s;animation-direction:reverse}
  .dk-x{top:-4px;right:-4px}
}
@keyframes dkfly1{

<script>
(() => {

const canSpeak = 'speechSynthesis' in window;

const S = {

  articles: [], prog: {}, words: {}, formIdx: new Map(), cats: [], wordsLoaded: false, legacy: null,
  view: 'read', cur: null, userChose: false, panel: null, pop: [],
  showPos: LS.get('showPos', false), showKw: LS.get('showKw', true), showSt: LS.get('showSt', true), zhAll: false, group: LS.get('group', false),

/* ---------- helpers on article data ---------- */
const cur = () => S.articles.find(a => a.id === S.cur) || null;
const blankNums = a => Object.keys(a.blanks || {}).sort((x, y) => +x - +y);
const optW = (a, l) => a.options?.[l]?.w || '';
function st(a, n){
  const b = a.blanks?.[n]; if (!b) return { done:false, ans:'' };

function toks(en){
  const out = [];
  String(en).split(/(\{\{\d+\}\})/).forEach(part => {
    const m = part.match(/^\{\{(\d+)\}\}$/);
    if (m) { out.push({ t:'b', n:m[1] }); return; }
    const re = /[A-Za-z]+(?:['’][A-Za-z]+)*|\d+(?:[.,]\d+)*|\s+|[^\sA-Za-z\d]+/g; let x;

function markKw(tk, keys, used){
  const wi = tk.map((t, i) => t.t === 'w' ? i : -1).filter(i => i >= 0);
  keys.forEach((k, ki) => {
    if (used.has(ki)) return;
    const parts = String(k.t).toLowerCase().split(/\s+/).filter(Boolean);
    if (!parts.length) return;
    for (let j = 0; j + parts.length <= wi.length; j++) {
      let ok = true;
      for (let q = 0; q < parts.length; q++) { const t = tk[wi[j + q]]; if (t.v.toLowerCase() !== parts[q] || t.kw != null) { ok = false; break; } }
      if (ok) { for (let q = 0; q < parts.length; q++) tk[wi[j + q]].kw = ki; used.add(ki); break; }

function lexOf(a, w){

  return ({ n:'pn', v:'pv', adj:'pa', adv:'pd' })[m[1]] || 'pf';
}
const shortPos = pos => String(pos || '').split(/[\s（(/]/)[0] || '?';

  return toks(a.paragraphs[p].sentences[s].en).map(t => t.t === 'b' ? (st(a, t.n).done ? optW(a, a.blanks[t.n].ans) : '____') : t.v).join('');
}
function sentHtml(a, p, s, hl){
  const tk = toks(a.paragraphs[p].sentences[s].en);
  const marks = new Set();
  if (hl) {
    const hp = String(hl).toLowerCase().split(/\s+/).filter(Boolean);
    const wi = tk.map((t, i) => t.t === 'w' ? i : -1).filter(i => i >= 0);
    for (let j = 0; j + hp.length <= wi.length; j++) if (hp.every((h, q) => tk[wi[j + q]].v.toLowerCase() === h)) for (let q = 0; q < hp.length; q++) marks.add(wi[j + q]);
  }

    if (t.t === 'b') { const r = st(a, t.n); return r.done ? `<span class="fill">${esc(optW(a, r.ans))}</span>` : `<span class="gap">(${t.n})____</span>`; }

/* ---------- spaced repetition: FSRS-4.5 with its published default parameters ---------- */
const FW = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];

function readBackup(file){

      const arts = (d.articles || []).filter(a => a && a.id && !S.articles.some(x => x.id === a.id));

      const notes = Object.entries(d.notes || {}).filter(([k]) => !S.notes[k]);
      const cats = ((d.settings || {}).cats || []).filter(c => !S.cats.includes(c));
      const summary = `新文章 ${arts.length} 篇 · 单词 ${words.length} 个 · 作答进度 ${prog.length} 篇 · 讲解 ${notes.length} 条 · 分类 ${cats.length} 个`;

    } catch(e){ S.bk = { msg: '这个文件不是精读日报导出的备份', err: true }; }

}
async function runRestore(){

  for (const [k, v] of P.prog) await write('progress/' + k, ref => ref.set(v));
  for (const [k, v] of P.notes) await write('notes/' + k, ref => ref.set(v));
  for (const w of P.words) { const k = wkey(w.w); const doc = strip({ ...w, w: k }); S.words[k] = { ...doc, _id: wdoc(k) }; await write('words/' + wdoc(k), ref => ref.set(doc)); }

}

评分标准（满分 15 分，五个档次）：
14 分档（13–15 分）：译文准确表达了原文意思，用词贴切，行文流畅，基本无语言错误，仅有个别小错。
11 分档（10–12 分）：译文基本表达了原文意思，结构较清晰，语言错误相对较少。
8 分档（7–9 分）：译文勉强表达了原文意思，用词欠准确，语言错误相当多，其中有些是严重错误。
5 分档（4–6 分）：译文仅表达了一小部分原文意思，用词不准确，有相当多的严重语言错误。
2 分档（1–3 分）：译文支离破碎，除个别词语或句子外，绝大部分文字没有表达原文意思。
漏译的部分按未表达原文意思处理。参考译文只是一种译法，学生用其他正确译法不扣分。

/* ---------- dictionary: 词典 tab + double-click anywhere blank to summon ---------- */
/* Sources: core dict/ (ECDICT + Open English WordNet + IPA), ext/ (the rest of ECDICT: phrases,
   technical and newer words, plus a few editor-added recent words), more/ (GCIDE etymology,
   roots, synonyms, look-alikes), dict/zh.json (Chinese → English for exam-level words). */
S.dk = { open: false, closing: false, q: '', tok: 0, sel: -1, list: null, P: null, back: [], letter: '', lpage: 1, pg: 1, focus: false, allDefs: false, wod: null, nf: null };
const DK_TOTAL_CORE = 87211;
const dkHist = () => LS.get('dkHist', []);
function dkRemember(w){ LS.set('dkHist', [w, ...dkHist().filter(x => x !== w)].slice(0, 24)); }
const dkNorm = s => String(s || '').toLowerCase().replace(/[’]/g, "'").replace(/^[\s"'“”‘.,;:!?()[\]]+|[\s"'“”‘.,;:!?()[\]]+$/g, '').replace(/\s+/g, ' ');
const hasCJK = s => /[㐀-鿿]/.test(s);

/* ---- extended lexicon: ext/index.json + ~1 MB sorted buckets ---- */
let EXT_IX = null, EXT_IX_P = null; const EXT = {}, EXT_P = {}, EXTK = {};
function extIndex(){
  if (EXT_IX) return Promise.resolve(EXT_IX);
  if (!EXT_IX_P) EXT_IX_P = fetch('ext/index.json').then(r => { if (!r.ok) throw new Error('http'); return r.json(); })
    .then(j => (EXT_IX = j)).catch(e => { EXT_IX_P = null; throw e; });
  return EXT_IX_P;
}
function extBucketName(ix, w){ const p2 = w.slice(0, 2); let name = null; for (const [s, f] of ix.b) { if (s <= p2) name = f; else break; } return name; }
function extBucket(name){
  if (EXT[name]) return Promise.resolve(EXT[name]);
  if (!EXT_P[name]) EXT_P[name] = fetch('ext/' + name).then(r => { if (!r.ok) throw new Error('http'); return r.json(); })
    .then(j => (EXT[name] = j)).catch(e => { delete EXT_P[name]; throw e; });
  return EXT_P[name];
}
async function extGet(w){ const ix = await extIndex(); const n = extBucketName(ix, w); if (!n) return undefined; return (await extBucket(n))[w]; }
async function extLookup(w){
  let e = await extGet(w), key = w;
  if (e === undefined && !/\s/.test(w)) for (const c of stems(w)) { const f = await extGet(c); if (f) { e = f; key = c; break; } }
  if (!e) return null;
  if (e.l) { const base = (await rawGet(e.l)) || (await extGet(e.l)); if (base && !base.l) return { lemma: e.l, form: w, ff: e.f || '', e: base }; }
  return { lemma: key, form: key !== w ? w : null, ff: '', e };
}
// popover and dictionary both fall through to the extended lexicon when the core has nothing
const coreLookup = dictLookup;
dictLookup = async function(word, ctxPos){
  const r = await coreLookup(word, ctxPos);
  if (r) return r;
  const w = dkNorm(word).replace(/'s$/, '');
  if (!/^[a-z]/.test(w)) return null;
  try { return await extLookup(w); } catch(e){ return null; }
};

/* ---- Chinese → English ---- */
let ZH = null, ZH_P = null;
function zhIndex(){
  if (ZH) return Promise.resolve(ZH);
  if (!ZH_P) ZH_P = fetch('dict/zh.json').then(r => { if (!r.ok) throw new Error('http'); return r.json(); }).then(j => (ZH = j)).catch(e => { ZH_P = null; throw e; });
  return ZH_P;
}
function zhSearch(q){
  const out = [];
  for (const [w, g, lv, fq] of ZH) {
    const i = g.indexOf(q); if (i < 0) continue;
    const exact = g.split(/[；;,，、]/).some(s => s.replace(/[（(][^)）]*[)）]/g, '').trim() === q);
    out.push({ r: (exact ? 0 : 2e7) + Math.min(i, 9) * 1e6 + (fq || 9e5), w, zh: g, lv });
    if (out.length > 600) break;
  }
  return out.sort((a, b) => a.r - b.r).slice(0, 40);
}

/* ---- suggestions ---- */
async function coreKeys(ch){ if (EXTK['core:' + ch]) return EXTK['core:' + ch]; const d = await shard(ch); return (EXTK['core:' + ch] = Object.keys(d).sort()); }
function lowerBound(a, q){ let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < q) lo = m + 1; else hi = m; } return lo; }
const fqOf = e => (e && (e.fq || e.bn)) || 1e7;
function shortZh(t){
  const line = String(t || '').split('\n').find(l => l && !l.startsWith('[')) || String(t || '').split('\n')[0] || '';
  const s = line.replace(/^(?:[a-z]+\.\s*)+/, '').trim();
  return s.length > 28 ? s.slice(0, 27) + '…' : s;
}
function dkItem(w, e, ext){ return { w, zh: shortZh(e && e.t), lv: levelOf(w) || '', ext: !!ext, nw: e && e.s === 'n' }; }
function editDist(a, b, max){   // optimal string alignment: insert / delete / substitute / swap two letters
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let pp = null, prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (pp && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, pp[j - 2] + 1);
      cur[j] = v; if (v < best) best = v;
    }
    if (best > max) return max + 1;
    pp = prev; prev = cur;
  }
  return prev[b.length];
}
async function dkFuzzy(q){
  if (q.length < 3 || /\s/.test(q)) return [];
  const keys = await coreKeys(q[0]); const D = DICT[q[0]]; const out = [];
  for (const k of keys) {
    if (Math.abs(k.length - q.length) > 2 || /\s/.test(k)) continue;
    const e = D[k]; if (e.l) continue;
    const d = editDist(q, k, 2); if (d <= 2) out.push([d, fqOf(e), k]);
  }
  out.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return out.slice(0, 8).map(x => dkItem(x[2], D[x[2]]));
}
async function dkSuggest(){
  const q = dkNorm(S.dk.q); const tok = ++S.dk.tok;
  S.dk.sel = -1;
  if (!q) { S.dk.list = null; dkRenderList(); return; }
  S.dk.list = { kind: 'loading' }; dkRenderList();
  try {
    if (hasCJK(q)) { await zhIndex(); if (tok !== S.dk.tok) return; S.dk.list = { kind: 'zh', items: zhSearch(q) }; dkRenderList(); return; }
    if (!/^[a-z]/.test(q)) { S.dk.list = { kind: 'none', items: [] }; dkRenderList(); return; }
    const keys = await coreKeys(q[0]); const D = DICT[q[0]];
    let hits = [];
    for (let i = lowerBound(keys, q); i < keys.length && keys[i].startsWith(q) && hits.length < 600; i++) { const e = D[keys[i]]; if (!e.l || keys[i] === q) hits.push(keys[i]); }
    hits.sort((a, b) => (b === q) - (a === q) || fqOf(D[a]) - fqOf(D[b]) || a.length - b.length);
    const items = hits.slice(0, 9).map(k => dkItem(k, D[k]));
    if (q.length >= 2) {
      const ix = await extIndex(); const name = extBucketName(ix, q);
      if (name) {
        const B = await extBucket(name); const ek = EXTK[name] || (EXTK[name] = Object.keys(B).sort());
        const eh = [];
        for (let i = lowerBound(ek, q); i < ek.length && ek[i].startsWith(q) && eh.length < 400; i++) if (!B[ek[i]].l || ek[i] === q) eh.push(ek[i]);
        eh.sort((a, b) => (b === q) - (a === q) || (/\s/.test(b) - /\s/.test(a)) * (q.includes(' ') ? 1 : 0) || fqOf(B[a]) - fqOf(B[b]) || a.length - b.length);
        eh.slice(0, items.length ? 6 : 12).forEach(k => items.push(dkItem(k, B[k], true)));
      }
    }
    if (tok !== S.dk.tok) return;
    if (items.length) { S.dk.list = { kind: 'pre', items }; dkRenderList(); return; }
    const fz = await dkFuzzy(q);
    if (tok !== S.dk.tok) return;
    S.dk.list = { kind: fz.length ? 'fuzzy' : 'none', items: fz }; dkRenderList();
  } catch(e){ if (tok === S.dk.tok) { S.dk.list = { kind: 'err', items: [] }; dkRenderList(); } }
}

/* ---- lookups & page turns ---- */
function dkLookup(word, opts = {}){
  const w = dkNorm(word); if (!w) return;
  const old = S.dk.P;
  if (old && old.w === w) { S.dk.focus = false; dkSyncMode(); return; }
  if (old && !opts.back) S.dk.back = [...S.dk.back, old.w].slice(-30);
  const root = dkRoot(); const sc = root && root.querySelector('#dkEntry');
  const oldHtml = sc ? sc.innerHTML : '', oldY = sc ? sc.scrollTop : 0;
  const P = { kind: 'dict', w, disp: w, pos: '', anchor: null, showDetail: true };
  S.dk.P = P; S.dk.allDefs = false; S.dk.nf = null; S.dk.pg += 2; S.dk.focus = false;
  loadDict(P, w, '');
  dkRenderEntry(false);
  if (old) dkFlip(opts.back ? -1 : 1, oldHtml, oldY);
  if (!hasCJK(w)) dkRemember(w);
}
function dkRoot(){ return S.dk.open ? $('#dkov .dbook') : (S.view === 'dict' ? $('#view .dbook') : null); }
function dkSyncMode(){ const r = dkRoot(); if (r) r.classList.toggle('listing', !S.dk.P || (S.dk.focus && !!S.dk.q) || !!S.dk.letter && S.dk.focus); }
/* page turn: forward = the old page lifts off the right and settles on the left;

function dkFlip(dir, oldHtml, oldY){
  const root = dkRoot(); if (!root || reduced() || root.classList.contains('listing')) return;
  const spread = root.querySelector('.dk-spread'), page = root.querySelector('.dk-r'), sc = root.querySelector('#dkEntry');
  if (!spread || !page || !sc) return;
  root.querySelectorAll('.dk-leaf,.dk-under').forEach(l => l.remove());
  const front = dir > 0 ? oldHtml : sc.innerHTML;
  const leaf = document.createElement('div');
  leaf.className = 'dk-leaf ' + (dir > 0 ? 'fwd' : 'bwd'); leaf.setAttribute('aria-hidden', 'true');
  leaf.innerHTML = `<div class="dk-lf"><div class="dk-scroll">${front}</div><i class="dk-shade"></i></div><div class="dk-lb"><i class="dk-shade"></i></div>`;
  spread.appendChild(leaf);
  leaf.querySelector('.dk-scroll').scrollTop = dir > 0 ? oldY : 0;
  let under = null;
  if (dir < 0) { under = document.createElement('div'); under.className = 'dk-under'; under.innerHTML = `<div class="dk-scroll">${oldHtml}</div>`; page.appendChild(under); under.firstChild.scrollTop = oldY; }

}

function isBlankPoint(e){
  const t = e.target;
  if (!(t instanceof Element)) return false;
  if (t.closest('input,textarea,select,button,a,label,img,svg,video,[data-act],[contenteditable],#pop,#dkov,.dbook,.toast,.grab-zone,.dk-leaf')) return false;
  let node = null, off = 0;
  try {
    if (document.caretPositionFromPoint) { const c = document.caretPositionFromPoint(e.clientX, e.clientY); if (c) { node = c.offsetNode; off = c.offset; } }
    else if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(e.clientX, e.clientY); if (r) { node = r.startContainer; off = r.startOffset; } }
  } catch(err){}
  if (node && node.nodeType === 3) {
    const rg = document.createRange(), len = node.length;
    for (const o of [off - 1, off]) {
      if (o < 0 || o >= len || !/\S/.test(node.data[o])) continue;
      rg.setStart(node, o); rg.setEnd(node, o + 1);
      const b = rg.getBoundingClientRect();
      if (b.width && e.clientX >= b.left - 3 && e.clientX <= b.right + 3 && e.clientY >= b.top - 3 && e.clientY <= b.bottom + 3) return false;
    }
  }
  return true;
}
let dkTapAt = 0;
function dkSummon(e){
  if (S.dk.open || Date.now() - dkTapAt < 600) return;
  dkTapAt = Date.now();
  try { getSelection().removeAllRanges(); } catch(err){}

}

    const s = st; st = null;
    if (!s.dragging) {
      if (s.fromGrab) { S.sheet = S.sheet === 'full' ? 'half' : 'full'; el.classList.toggle('full', S.sheet === 'full'); }
      return;
    }
    const H = window.innerHeight, half = H * 0.62, full = H * 0.92;
    const h = el.getBoundingClientRect().height;
    let target;
    if (s.v > 0.5) target = s.h0 > (half + full) / 2 && h > half * 0.7 ? 'half' : 'close';
    else if (s.v < -0.5) target = 'full';
    else target = h < half * 0.6 ? 'close' : h < (half + full) / 2 ? 'half' : 'full';
    el.classList.remove('dragging');
    void el.offsetHeight;
    if (target === 'close') {
      S.panel = null; S.sheet = 'half';
      el.classList.remove('open', 'full');
      setTimeout(() => { el.style.height = ''; renderPanel(); }, 300);
      highlight();
    } else {
      S.sheet = target;
      el.classList.toggle('full', target === 'full');
      el.style.height = '';
    }
  }
  el.addEventListener('touchstart', e => { lastTouch = Date.now(); if (!isSheet() || e.touches.length !== 1) return; st = begin(e.touches[0].clientY, !!e.target.closest('[data-grab]')); }, { passive: true });
  el.addEventListener('touchmove', e => { if (st) move(e.touches[0].clientY, e); }, { passive: false });
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
  el.addEventListener('mousedown', e => {
    if (!isSheet() || !e.target.closest('[data-grab]') || Date.now() - lastTouch < 800) return;
    st = begin(e.clientY, true); e.preventDefault();
    const mm = ev => move(ev.clientY, ev);
    const mu = () => { window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); end(); };
    window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
  });
})();

/* ---------- boot ---------- */
function migrateVocab(){
  if (!S.wordsLoaded || !S.legacy || !S.legacy.length) return;
  const L = S.legacy; S.legacy = [];
  L.forEach(v => {
    const k = wkey(v.w); if (!k) return;
    if (!S.words[k]) upsertWord(k, { status: v.done ? 'known' : 'new', at: v.at || Date.now(), forms: [k, ...inflect(k)], fill: { pos: v.pos, zh: v.zh, en: v.en, ph: v.ph } },
      v.p != null ? { art: v.art, title: v.title, p: v.p, s: v.s, text: v.ctx || '', at: v.at || Date.now() } : null);
    write('vocab/' + v.id, ref => ref.delete());
  });
}
render();
loadLevel().then(() => {
  if (S.view === 'read') { renderView(); textChanged(); if (S.panel && S.panel.type === 'nw') renderPanel(true); }
}).catch(() => {});
(async () => {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') { S.dbState = 'none'; render(); return; }
  C.use('sample').then(s => { S.sample = s || null; if (S.view === 'import') { S.impDirty = true; renderView(); } else renderPop(true); }).catch(() => {});
  C.use('downloads').then(d => { S.dl = d || null; }).catch(() => {});
  let db = null;
  try { db = await C.use('db'); } catch(e){ db = null; }
  if (!db) { S.dbState = 'none'; render(); return; }
  S.db = db;
  const settle = () => { if (!S.userChose) S.cur = pickDefault(); };
  const quietVocab = () => S.view === 'vocab' && (S.rv || S.dt || S.vtab === 'backup');
  db.collection('articles').onSnapshot(snap => {
    S.articles = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
    S.dbState = 'ok';
    if (S.cur && !S.articles.find(a => a.id === S.cur)) S.cur = null;
    if (!S.cur) settle();
    renderChrome(); repairCtx();
    if (S.view === 'read' || S.view === 'archive') { renderView(); afterReadRender(); renderPanel(true); renderPop(true); }
    else if (S.view === 'welcome') renderView();
  }, () => { S.dbState = 'err'; render(); });
  db.collection('progress').onSnapshot(snap => {
    let changed = false;
    snap.docs.forEach(d => { const v = d.data(); if (canon(v) !== canon(S.prog[d.id])) { changed = true; S.prog[d.id] = v; } });
    if (!changed && S.progLoaded) return;
    S.progLoaded = true;
    if (!S.userChose) settle();
    // first visit (nothing ever opened, welcome never dismissed): show the front page instead of an article
    if (!S.welcomeChecked) {
      S.welcomeChecked = true;
      const fresh = !LS.get('welcomed', false) && !Object.values(S.prog).some(p => p && p.lastOpened);
      if (!fresh) LS.set('welcomed', true);
      else if (!S.userChose && S.view === 'read') { S.view = 'welcome'; S.enter = true; render(); return; }
    }
    if (S.view === 'read' || S.view === 'archive') { renderChrome(); renderView(); afterReadRender(); if (S.panel) renderPanel(true); }
  }, () => {});
  db.collection('notes').onSnapshot(snap => {
    snap.docs.forEach(d => { S.notes[d.id] = d.data(); });
    const P = popCur(); if (P && P.showDetail) renderPop(true);
  }, () => {});
  db.collection('words').onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && v.w) m[v.w] = { ...v, _id: d.id }; });
    const same = S.wordsLoaded && Object.keys(m).length === Object.keys(S.words).length && Object.keys(m).every(k => canon(m[k]) === canon(S.words[k]));
    S.words = m; S.wordsLoaded = true; rebuildIdx(); migrateVocab(); repairCtx();
    if (same) return;
    renderChrome();
    if (S.view === 'read') { renderView(); afterReadRender(); if (S.panel && S.panel.type === 'nw') renderPanel(true); }
    else if (S.view === 'vocab' && !quietVocab()) { if (S.vtab === 'list') renderVocabList(); else renderView(); }
    else if (S.view === 'archive') renderView();
    if (popCur()) renderPop(true);
  }, () => {});
  db.doc('meta/settings').onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    S.cats = d && Array.isArray(d.cats) ? d.cats.map(String) : [];
    if (popCur()) renderPop(true);
    if (S.view === 'vocab' && S.vtab === 'list') renderVocabList();
  }, () => {});
  db.collection('mistakes').onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = { ...d.data(), _id: d.id }; });
    const same = Object.keys(m).length === Object.keys(S.mistakes).length && Object.keys(m).every(k => canon(m[k]) === canon(S.mistakes[k]));
    S.mistakes = m; renderChrome();
    if (!same && S.view === 'mistakes' && !Object.keys(S.mkRetry).length) renderView();
  }, () => {});
  db.collection('vocab').onSnapshot(snap => {
    S.legacy = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    migrateVocab();
  }, () => {});
})();

})();
</script>

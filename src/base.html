<title>The Close Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Kalam:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Serif+SC:wght@400;600;900&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
/* Layout: a newspaper reading page. Article column + proof-reader's margin rail.
   Keywords and answers are marked in blue editor's pencil; wrong picks are corrected in red. */
:root{
  --paper:#edf0ea; --sheet:#f8f9f6; --paper-2:#e1e5de;
  --ink:#14181b; --ink-2:#434d55; --ink-3:#77828a; --rule:#bfc6be;
  --pencil:#2340b0; --pencil-wash:rgba(35,64,176,.09); --marker:rgba(236,190,52,.42);
  --red:#b3302a; --red-wash:rgba(179,48,42,.08); --ok:#1d7548; --ok-wash:rgba(29,117,72,.10);
  --pos-n:#1d6b74; --pos-v:#86338c; --pos-adj:#8f6208; --pos-adv:#3d5c9e; --pos-f:#77828a;
  --shadow:0 -10px 30px rgba(20,24,27,.14);
  --sb:rgba(20,24,27,.16); --sb-hover:rgba(20,24,27,.34); --sb-active:rgba(35,64,176,.55);
  --f-mast:"UnifrakturMaguntia","Old Standard TT",Georgia,serif;
  --f-head:"Old Standard TT","Noto Serif SC",Georgia,serif;
  --f-body:"Newsreader",Georgia,"Noto Serif SC","Songti SC",serif;
  --f-zh:"Noto Serif SC","Songti SC","STSong",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-hand:"Kalam","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151a; --sheet:#171c22; --paper-2:#1f262d;
    --ink:#e4e7e1; --ink-2:#a9b1b6; --ink-3:#7f8a91; --rule:#2e373f;
    --pencil:#93abff; --pencil-wash:rgba(147,171,255,.13); --marker:rgba(236,190,52,.30);
    --red:#ff8476; --red-wash:rgba(255,132,118,.12); --ok:#62d29a; --ok-wash:rgba(98,210,154,.12);
    --pos-n:#6fc7cf; --pos-v:#d99ee2; --pos-adj:#e2b65c; --pos-adv:#a6bbef; --pos-f:#7f8a91;
    --shadow:0 -10px 30px rgba(0,0,0,.5);
    --sb:rgba(228,231,225,.16); --sb-hover:rgba(228,231,225,.34); --sb-active:rgba(147,171,255,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151a; --sheet:#171c22; --paper-2:#1f262d;
  --ink:#e4e7e1; --ink-2:#a9b1b6; --ink-3:#7f8a91; --rule:#2e373f;
  --pencil:#93abff; --pencil-wash:rgba(147,171,255,.13); --marker:rgba(236,190,52,.30);
  --red:#ff8476; --red-wash:rgba(255,132,118,.12); --ok:#62d29a; --ok-wash:rgba(98,210,154,.12);
  --pos-n:#6fc7cf; --pos-v:#d99ee2; --pos-adj:#e2b65c; --pos-adv:#a6bbef; --pos-f:#7f8a91;
  --shadow:0 -10px 30px rgba(0,0,0,.5);
  --sb:rgba(228,231,225,.16); --sb-hover:rgba(228,231,225,.34); --sb-active:rgba(147,171,255,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:10px 56px}

/* ---------- masthead ---------- */
.mast-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-block:6px;border-bottom:1px solid var(--rule)}
.mast-name{font-family:var(--f-mast);font-weight:400;font-size:clamp(2.5rem,8.5vw,5.4rem);line-height:1;text-align:center;margin:.18em 0 .05em;letter-spacing:.01em}
.mast-sub{text-align:center;font:600 13px/1.6 var(--f-zh);letter-spacing:.45em;color:var(--ink-2);margin-bottom:10px;padding-left:.45em}
.tabs{display:flex;justify-content:safe center;gap:2px;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 14px;font:500 14px/1.2 var(--f-zh);color:var(--ink-2);cursor:pointer;white-space:nowrap;position:relative}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;background:var(--pencil);border-radius:2px}
.tab .ct{font:500 11px var(--f-mono);color:var(--pencil);margin-left:4px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;margin-top:28px}
@media (min-width:1040px){.layout.has-rail{grid-template-columns:minmax(0,1fr) 340px}}
.view{min-width:0}
.story{max-width:43rem;margin-inline:auto}
.kicker{font:600 11px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--pencil)}
.headline{font:700 clamp(2rem,5.2vw,3.15rem)/1.08 var(--f-head);text-wrap:balance;margin:.22em 0 .2em;letter-spacing:-.005em}
.headline.sm{font-size:clamp(1.7rem,4vw,2.4rem)}
.dek{font:400 1.05rem/1.7 var(--f-zh);color:var(--ink-2);margin:0 0 14px}
.byline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font:500 12px/1.5 var(--f-mono);color:var(--ink-3);border-block:1px solid var(--rule);padding-block:8px;font-variant-numeric:tabular-nums}
.byline b{color:var(--ink);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 26px}
.tbtn{font:500 13px/1.2 var(--f-zh);padding:7px 11px;border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.tbtn:hover{border-color:var(--ink-2);color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tbtn.warn{border-color:var(--red);color:var(--red)}

/* ---------- article body ---------- */
.para{display:grid;grid-template-columns:3rem minmax(0,1fr);gap:0 14px;margin-bottom:1.35em}
.gut{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-top:.45em}
.pnum{font:500 11px var(--f-mono);color:var(--ink-3)}
.ptr{font:500 12px/1 var(--f-zh);color:var(--pencil);border:1px solid currentColor;background:none;padding:4px 6px;border-radius:3px;cursor:pointer}
.ptr[aria-pressed="true"]{background:var(--pencil);color:var(--sheet)}
.ptext{font-size:1.17rem;line-height:1.88;margin:0;min-width:0;overflow-wrap:break-word}
.para:first-child .ptext::first-letter{font-family:var(--f-head);font-weight:700;font-size:3.7em;float:left;line-height:.8;padding:.07em .09em 0 0}
.para-zh{grid-column:2;font:400 .98rem/1.95 var(--f-zh);color:var(--ink-2);border-left:2px solid var(--pencil);padding:.55em 0 .55em 1em;margin-top:.5em;background:linear-gradient(90deg,var(--pencil-wash),transparent 75%)}
@media (max-width:620px){
  .para{grid-template-columns:minmax(0,1fr)}
  .gut{flex-direction:row;align-items:center;padding:0;margin-bottom:4px}
  .para-zh{grid-column:1}
  .ptext{font-size:1.1rem}
}
.s{border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .2s}
.s.on{background:var(--pencil-wash)}
.s.flash{animation:flash 2.6s ease-out}
@keyframes flash{0%,30%{background:var(--marker)}100%{background:transparent}}
.w{cursor:pointer;border-radius:2px}
.w:hover{background:var(--pencil-wash)}
.w.on{background:var(--marker)}
.show-kw .kw{text-decoration:underline;text-decoration-color:var(--pencil);text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-skip-ink:none}
.show-kw .kw.ph{text-decoration-style:wavy;text-decoration-thickness:1.4px;text-underline-offset:6px}
.show-kw .kw .w{text-decoration:inherit}
.show-pos .ptext{line-height:2.85}
.show-pos .para:first-child .ptext::first-letter{font:inherit;float:none;padding:0}
.show-pos .w{position:relative;display:inline-block;line-height:1.35}
.show-pos .w::after{content:attr(data-pos);position:absolute;left:50%;top:100%;transform:translateX(-50%);font:600 9.5px/1 var(--f-mono);color:var(--pc,var(--pos-f));white-space:nowrap;margin-top:1px;letter-spacing:0;pointer-events:none}
.pn{--pc:var(--pos-n)} .pv{--pc:var(--pos-v)} .pa{--pc:var(--pos-adj)} .pd{--pc:var(--pos-adv)} .pf{--pc:var(--pos-f)}

.blank{display:inline-flex;align-items:baseline;gap:.35em;border:0;border-bottom:1.5px solid var(--ink);background:none;padding:0 .25em;margin:0 .1em;min-width:5.6em;cursor:pointer;color:var(--ink);line-height:1.3;border-radius:2px 2px 0 0;vertical-align:baseline}
.blank:hover{background:var(--pencil-wash)}
.blank.on{background:var(--marker)}
.bn{font:600 .68em var(--f-mono);color:var(--ink-3)}
.bw{font:400 1.08em var(--f-hand);color:var(--pencil);white-space:nowrap}
.blank.ok{border-bottom-color:var(--pencil)}
.blank.ok .bw::after{content:" \2713";font-family:var(--f-body);font-size:.85em}
.blank.bad{border-bottom-color:var(--red)}
.blank.bad s{color:var(--red);text-decoration-thickness:2px}
.blank.shown .bw{color:var(--ink-2)}

.guard{display:block;width:100%;text-align:left;font:400 13px/1.5 var(--f-zh);color:var(--ink-3);background:none;border:1px dashed var(--rule);border-radius:3px;padding:8px 10px;cursor:pointer}
.guard:hover{color:var(--ink);border-color:var(--ink-3)}

/* ---------- word bank ---------- */
.bank{margin-top:2.6rem;border:1.5px solid var(--ink);padding:16px 18px 14px;background:var(--sheet)}
.bank>header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.bank h3{margin:0;font:700 1.3rem/1.2 var(--f-head)}
.bank h3 span{font:500 13px var(--f-zh);color:var(--ink-3);margin-left:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px}
.opt{display:flex;align-items:baseline;gap:.5em;text-align:left;background:none;border:0;padding:6px 6px;border-radius:3px;cursor:pointer;font:400 1.03rem/1.3 var(--f-body);color:var(--ink);min-width:0}
.opt:hover{background:var(--pencil-wash)}
.opt.on{background:var(--marker)}
.opt b{font:600 .78rem var(--f-mono);color:var(--ink-3);min-width:1.7em}
.opt.used{color:var(--ink-3)}
.opt .u{margin-left:auto;font:600 .72rem var(--f-mono);color:var(--pencil)}
.grp+.grp{margin-top:10px}
.grp h4{margin:0 0 4px;font:600 11px/1.6 var(--f-mono);letter-spacing:.08em;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.grp h4 span{color:var(--ink-3);font-weight:400}
.bank-note{margin:10px 0 0;font:400 13px/1.6 var(--f-zh);color:var(--ink-3)}

.tips{margin-top:2.2rem;border-top:3px double var(--ink);padding-top:12px}
.tips h3{margin:0 0 8px;font:700 1.25rem var(--f-head)}
.tips h3 span{font:500 13px var(--f-zh);color:var(--ink-3);margin-left:8px}
.tips ol{margin:0;padding:0;list-style:none;counter-reset:t;display:grid;gap:8px}
.tips li{counter-increment:t;display:grid;grid-template-columns:2rem minmax(0,1fr);font:400 .98rem/1.75 var(--f-zh)}
.tips li::before{content:counter(t);font:600 .8rem/1.9 var(--f-mono);color:var(--pencil)}

/* ---------- side rail / sheet ---------- */
.panel{display:none}
.layout.has-rail .panel{display:block}
.grab{display:none}
@media (min-width:1040px){
  .layout.has-rail .panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:16px 18px 22px}
  .p-close{display:none}
}
.grab-zone{display:none}
@media (max-width:1039.98px){
  .layout.has-rail .panel{position:fixed;left:0;right:0;bottom:0;z-index:20;height:62vh;overflow:auto;overscroll-behavior:contain;background:var(--sheet);border:2px solid var(--ink);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:0 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1),height .28s cubic-bezier(.2,.8,.2,1)}
  .layout.has-rail .panel.full{height:92vh}
  .layout.has-rail .panel.open{transform:none}
  .layout.has-rail .panel.dragging{transition:none}
  .grab-zone{display:block;position:sticky;top:0;z-index:2;margin:0 -18px 4px;padding:10px 0 10px;background:var(--sheet);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
  .grab{display:block;width:44px;height:5px;border-radius:5px;background:var(--ink-3);opacity:.55;margin:0 auto}
  .grab-zone:active .grab{opacity:.9}
}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.p-eyebrow{font:600 11px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--pencil)}
.p-close{background:none;border:1px solid var(--rule);border-radius:999px;width:30px;height:30px;cursor:pointer;color:var(--ink-2);font:400 16px/1 var(--f-mono)}
.p-head{display:flex;align-items:center;gap:10px;margin-top:4px}
.p-word{font:700 2.1rem/1.15 var(--f-head);margin:0;overflow-wrap:anywhere}
.p-meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{display:inline-block;font:600 12px/1.4 var(--f-mono);padding:2px 7px;border-radius:3px;border:1px solid var(--pc,var(--ink-3));color:var(--pc,var(--ink-2))}
.p-zh{font:600 1.15rem/1.6 var(--f-zh);margin:6px 0 0}
.p-miss{font:400 .95rem/1.6 var(--f-zh);color:var(--ink-3);margin:6px 0}
.note{margin-top:12px;background:var(--pencil-wash);border-left:3px solid var(--pencil);padding:8px 11px;font:400 .93rem/1.7 var(--f-zh)}
.note b{font-weight:600;color:var(--pencil)}
.p-sec{margin:18px 0 6px;padding-top:10px;border-top:1px solid var(--rule);font:600 10.5px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.p-en{font:400 1.02rem/1.7 var(--f-body);margin:0 0 8px}
.p-en mark{background:var(--marker);color:inherit;border-radius:2px;padding:0 1px}
.p-en .fill{font:400 1.05em var(--f-hand);color:var(--pencil)}
.p-en .gap{font:600 .85em var(--f-mono);color:var(--ink-3)}
.p-zht{font:400 .95rem/1.85 var(--f-zh);color:var(--ink-2);margin:0}
.p-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pbtn{font:500 13.5px/1.2 var(--f-zh);padding:8px 13px;border-radius:3px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.pbtn:hover{background:var(--pencil-wash)}
.pbtn.primary{background:var(--ink);color:var(--paper)}
.pbtn.primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.pbtn.ghost{border-color:var(--rule);color:var(--ink-2)}
.pbtn:disabled{opacity:.45;cursor:default}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;border:1px solid var(--rule);background:none;color:var(--ink-2);cursor:pointer;flex:none}
.ibtn:hover{color:var(--pencil);border-color:var(--pencil)}
.ibtn svg{width:16px;height:16px}

.phon{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px}
.phon .ipa{font:400 1rem var(--f-body);color:var(--ink-2)}
.tag{font:600 10.5px/1.5 var(--f-mono);letter-spacing:.04em;padding:1px 6px;border-radius:3px;background:var(--paper-2);color:var(--ink-2)}
.tag.hot{background:var(--pencil-wash);color:var(--pencil)}
.stars{font:400 12px var(--f-mono);color:var(--pos-adj);letter-spacing:1px}
.lemma-note{font:400 .92rem/1.6 var(--f-zh);color:var(--ink-2);margin:8px 0 0}
.lemma-note b{font:600 1.02rem var(--f-body);color:var(--ink)}
.ctxbox{margin-top:12px;border:1.5px solid var(--ink);padding:9px 12px 10px;position:relative}
.ctxbox .lbl{display:block;font:600 10.5px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--pencil);margin-bottom:5px}
.ctxbox .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px}
.ctxbox .zh{font:600 1.12rem/1.55 var(--f-zh)}
.ctxbox .cen{margin:6px 0 0;font:italic 400 1rem/1.5 var(--f-body);color:var(--ink-2)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.dl li{display:grid;grid-template-columns:2.9rem minmax(0,1fr);gap:6px;align-items:baseline}
.dl .tp{font:600 11.5px var(--f-mono);color:var(--pc,var(--ink-3))}
.dl .zh{font:400 .97rem/1.65 var(--f-zh)}
.dl .en{font:400 .98rem/1.55 var(--f-body)}
.dl li.hit .zh,.dl li.hit .en{color:var(--ink)}
.dl li:not(.hit) .zh,.dl li:not(.hit) .en{color:var(--ink-2)}
.dl.en-list{counter-reset:d}
.dl.en-list li{grid-template-columns:1.4rem 2.6rem minmax(0,1fr)}
.dl.en-list li::before{counter-increment:d;content:counter(d);font:500 11px var(--f-mono);color:var(--ink-3)}
.exm{display:block;font-style:italic;font-size:.9em;color:var(--ink-3);margin-top:2px}
.exm::before{content:"e.g. ";font:600 10px var(--f-mono);font-style:normal;color:var(--ink-3)}
.more{background:none;border:0;padding:6px 0 0;font:500 12.5px var(--f-zh);color:var(--pencil);cursor:pointer}
.dsrc{margin-top:16px;font:500 10.5px/1.5 var(--f-mono);color:var(--ink-3)}
.dload{font:400 .92rem var(--f-zh);color:var(--ink-3);margin-top:12px}
.xbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;margin-top:18px;padding:11px 14px;background:var(--paper);border:1.5px dashed var(--ink-3);border-radius:4px;cursor:pointer;text-align:left}
.xbtn span{font:600 14.5px var(--f-zh);color:var(--ink)}
.xbtn small{font:500 11.5px var(--f-mono);color:var(--ink-3)}
.xbtn:hover{border-color:var(--pencil);background:var(--pencil-wash)}
.xsec{margin-top:18px;border-top:3px double var(--ink);padding-top:6px}
.xh{margin:8px 0 0;font:700 1.15rem var(--f-head)}
.ety{font:400 .98rem/1.7 var(--f-body);margin:0}
.ai{margin-top:12px;background:var(--pencil-wash);border-left:3px solid var(--pencil);padding:9px 12px}
.ai .lbl{display:block;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--pencil);margin-bottom:4px}
.ai p{margin:6px 0 0;font:400 .93rem/1.75 var(--f-zh)}
.ai p b{font-weight:600;color:var(--pencil);margin-right:6px}
.ai ul{margin:4px 0 0;padding-left:1.1em;font:400 .92rem/1.7 var(--f-zh)}
.ai .exl li{font-family:var(--f-body)}
.ai .exl span{display:block;font:400 .88rem/1.6 var(--f-zh);color:var(--ink-2)}
.roots{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.roots li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font:400 .95rem var(--f-body)}
.roots b{font:600 1rem var(--f-mono);color:var(--pencil)}
.roots .rm{color:var(--ink)} .roots .ro{font:400 12px var(--f-zh);color:var(--ink-3)}
.rel{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rel li{display:grid;grid-template-columns:minmax(6.5rem,auto) auto minmax(0,1fr);gap:8px;align-items:baseline}
.rw{background:none;border:0;padding:2px 0;font:500 1.02rem var(--f-body);color:var(--ink);text-align:left;cursor:pointer;text-decoration:underline dotted var(--ink-3);text-underline-offset:4px}
.rw:hover{color:var(--pencil)}
.rw u{text-decoration:none;color:var(--red);font-weight:700;background:var(--red-wash);border-radius:2px}
.rz{font:400 .9rem/1.5 var(--f-zh);color:var(--ink-2);min-width:0}

const S = {

  articles: [], prog: {}, vocab: [],
  view: 'read', cur: null, userChose: false, panel: null,
  showPos: LS.get('showPos', false), showKw: LS.get('showKw', true), zhAll: false, group: LS.get('group', false),
  hideZh: LS.get('hideZh', false), vf: 'all', va: 'all', vshow: new Set(),
  notes: {}, dictAll: false, sheet: 'half',
  openZh: new Set(), unguard: new Set(), hint: false, confirmReset: false, confirmDel: null, selAt: 0,

/* ---------- helpers on article data ---------- */
const cur = () => S.articles.find(a => a.id === S.cur) || null;

const optW = (a, l) => a.options?.[l]?.w || '';
function st(a, n){
  const b = a.blanks?.[n]; if (!b) return { done:false, ans:'' };
  const p = S.prog[a.id] || {};

function score(a){

function toks(en){

function sentHasOpen(a, p, s){ return toks(a.paragraphs[p].sentences[s].en).some(t => t.t === 'b' && !st(a, t.n).done); }

  return toks(a.paragraphs[p].sentences[s].en).map(t => t.t === 'b' ? (st(a, t.n).done ? optW(a, a.blanks[t.n].ans) : '____') : t.v).join('');

  const tk = toks(a.paragraphs[p].sentences[s].en);
  const marks = new Set();
  if (hl) {
    const hp = String(hl).toLowerCase().split(/\s+/).filter(Boolean);
    const wi = tk.map((t, i) => t.t === 'w' ? i : -1).filter(i => i >= 0);
    for (let j = 0; j + hp.length <= wi.length; j++) if (hp.every((h, q) => tk[wi[j + q]].v.toLowerCase() === h)) for (let q = 0; q < hp.length; q++) marks.add(wi[j + q]);
  }
  return tk.map((t, i) => {
    if (t.t === 'b') { const r = st(a, t.n); return r.done ? `<span class="fill">${esc(optW(a, r.ans))}</span>` : `<span class="gap">(${t.n})____</span>`; }

  return html;
}
const zhBlock = (a, p, s) => guarded(`s${p}-${s}`, sentHasOpen(a, p, s), `<p class="p-zht">${esc(a.paragraphs[p].sentences[s].zh)}</p>`, '这句译文会透露还没作答的空 · 点按显示');

/* ---------- dictionary: Chinese senses from ECDICT (MIT); English senses, examples, IPA from Open English WordNet (CC BY 4.0) ---------- */
/* Entries live in small sorted buckets (<dir>/b/NNN.json, ~40 KB gzipped) listed in <dir>/b/index.json,
   built by tools/split_dict.py. One lookup fetches one bucket; a whole letter (the dictionary's A–Z
   browser, prefix suggestions) fetches that letter's buckets in parallel. Slow phone networks: each
   fetch times out after 15 s and is retried once. */
async function getJSON(url){
  for (let i = 0; ; i++) {
    try {
      const r = await fetch(url, typeof AbortSignal !== 'undefined' && AbortSignal.timeout ? { signal: AbortSignal.timeout(15000) } : {});
      if (!r.ok) throw new Error('http ' + r.status);

function bucketStore(dir){
  let IX = null, IX_P = null; const B = {}, B_P = {}, L = {}, L_P = {};

    : (pend[k] || (pend[k] = make().then(v => (cache[k] = v)).catch(e => { delete pend[k]; throw e; })));

  return {
    letters: L,                                            // whole letters that are fully loaded
    async get(w){
      if (L[w[0]]) return L[w[0]][w];
      const n = nameFor(await index(), w);
      return n ? (await bucket(n))[w] : undefined;
    },
    letter(ch){
      return once(L, L_P, ch, async () => {
        const names = (await index()).filter(x => x[0][0] === ch).map(x => x[1]);

const DICTS = bucketStore('dict');
const DICT = DICTS.letters;                                // DICT[ch] is set once a whole letter is loaded

async function rawGet(w){ return /^[a-z]/.test(w) ? DICTS.get(w) : undefined; }

    w.replace(/(.)\1ed$/, '$1'), w.replace(/ing$/, ''), w.replace(/ing$/, 'e'), w.replace(/(.)\1ing$/, '$1'), w.replace(/ier$/, 'y'), w.replace(/iest$/, 'y'), w.replace(/er$/, ''), w.replace(/est$/, ''), w.replace(/ly$/, '')];

function renderToks(a, tk){

function blankHtml(a, n){

const POS_RANK = p => /原形/.test(p) ? 0 : /^v/.test(p) ? 1 : /^n/.test(p) ? 2 : /^adj/.test(p) ? 3 : /^adv/.test(p) ? 4 : 5;

/* ---------- panel ---------- */
function renderPanel(keep){
  const el = $('#panel'); const a = cur(); const y = el.scrollTop;
  if (S.view !== 'read' || !a) { el.innerHTML = ''; el.classList.remove('open'); return; }
  const P = S.panel;
  el.classList.toggle('open', !!P);
  if (!P) S.sheet = 'half';
  el.classList.toggle('full', !!P && S.sheet === 'full');
  let h = '';
  try {
    if (!P) h = idleHtml();
    else if (P.type === 'word') h = wordCard(a, P);
    else if (P.type === 'blank') h = blankCard(a, P.n);
    else if (P.type === 'opt') h = optCard(a, P.l);
    else if (P.type === 'sent') h = sentCard(a, P.list);
    else if (P.type === 'dict') h = dictCard(P);
  } catch(e){ h = idleHtml(); }
  el.innerHTML = `<div class="grab-zone" data-grab aria-label="拖动调整高度，下拉关闭" role="button" tabindex="-1"><span class="grab"></span></div>${h}`;
  el.scrollTop = keep ? y : 0;
  highlight();
}
const top = label => `<div class="p-top"><span class="p-eyebrow">${label}</span><button class="p-close" data-act="close" aria-label="关闭">×</button></div>`;
function idleHtml(){
  return `<div class="idle">${top('读报指南')}<h3>怎么用这一版</h3><ul>
    <li><b>点单词</b><span>看词性、中文释义和整句翻译，可收进单词本</span></li>
    <li><b>选中句子</b><span>拖选一句或几句，右侧给出对应译文</span></li>
    <li><b>点空格</b><span>从词库里作答，立刻判对错并给出解题思路</span></li>
    <li><b>¶ 译文</b><span>整段中英对照；会透露答案的译文先折起来</span></li>
  </ul>
  <div class="legend"><span class="l1">单个重点词</span><span class="l2">固定搭配</span></div>
  <div class="posleg"><span class="chip pn">n. 名词</span><span class="chip pv">v. 动词</span><span class="chip pa">adj. 形容词</span><span class="chip pd">adv. 副词</span><span class="chip pf">功能词</span></div></div>`;
}
function wordCard(a, P){
  const e = lexOf(a, P.w);
  const kw = P.k != null ? (a.keys || [])[P.k] : null;
  const saved = vocabHas(a.id, P.w);
  const kwSaved = kw && kw.k === 'phrase' && vocabHas(a.id, kw.t);
  P.pos = e ? e[0] : '';
  return `${top(`¶${P.p + 1} · 第 ${P.s + 1} 句`)}
    <div class="p-head"><h2 class="p-word">${esc(P.disp)}</h2>${speakBtn(P.disp)}</div>
    ${dictHead(P)}
    ${e ? `<div class="ctxbox"><span class="lbl">本文释义 · In this text</span><div class="row"><span class="chip ${posClass(e[0])}">${esc(e[0])}</span><span class="zh">${esc(e[1])}</span></div>${e[2] ? `<p class="cen">${esc(e[2])}</p>` : ''}</div>`
        : `<p class="p-miss">还没有这个词在本文中的释义。</p>${S.sample ? `<button class="pbtn" data-act="lookup" id="lookupBtn">让 Claude 按语境释义</button>` : ''}`}
    ${kw ? `<div class="note"><b>${kw.k === 'phrase' ? '重点搭配' : '重点词'} · ${esc(kw.t)}</b><br>${esc(kw.n)}</div>` : ''}
    <div class="p-actions">
      <button class="pbtn ${saved ? 'ghost' : 'primary'}" data-act="save" ${e ? '' : 'disabled'}>${saved ? '已收藏 · 移除' : '加入单词本'}</button>
      ${kw && kw.k === 'phrase' ? `<button class="pbtn ghost" data-act="savekw">${kwSaved ? '搭配已收藏 · 移除' : '收藏这个搭配'}</button>` : ''}
    </div>
    ${dictBody(P)}${P.dict && P.dict.state === 'ok' ? detailBlock(P) + DSRC : ''}`;
}
function sentCard(a, list){
  return `${top(list.length > 1 ? `选中 ${list.length} 句` : `¶${list[0][0] + 1} · 第 ${list[0][1] + 1} 句`)}
    ${list.map(([p, s]) => `<h5 class="p-sec">¶${p + 1} · 第 ${s + 1} 句</h5><p class="p-en">${sentHtml(a, p, s)}</p>${zhBlock(a, p, s)}`).join('')}`;
}
function locate(a, n){
  for (let p = 0; p < a.paragraphs.length; p++) for (let s = 0; s < a.paragraphs[p].sentences.length; s++)

function blankCard(a, n){
  const b = a.blanks[n]; if (!b) return idleHtml();

    const o = st(a, t.n); return o.done ? `<span class="fill">${esc(optW(a, o.ans))}</span>` : `<span class="gap">(${t.n})____</span>`;
  }).join('');
  const L = Object.keys(a.options || {}).sort();

    <div class="ans-big"><b>${esc(r.ans)})</b><span>${esc(ans.w)}</span><i>${esc(ans.pos || '')} ${esc(ans.zh || '')}</i></div>

function optCard(a, l){
  const o = a.options[l]; if (!o) return idleHtml();

    <div class="p-actions"><button class="pbtn ${vocabHas(a.id, o.w) ? 'ghost' : 'primary'}" data-act="saveopt" data-l="${l}">${vocabHas(a.id, o.w) ? '已收藏 · 移除' : '加入单词本'}</button>

/* ---------- archive ---------- */

  const cards = S.articles.map(a => {

/* ---------- vocab ---------- */
function vocabHtml(){
  let list = S.vocab;
  if (S.vf === 'todo') list = list.filter(v => !v.done);
  if (S.vf === 'done') list = list.filter(v => v.done);
  if (S.va !== 'all') list = list.filter(v => v.art === S.va);
  const todo = S.vocab.filter(v => !v.done).length;
  const arts = [...new Set(S.vocab.map(v => v.art))];
  const head = `<div class="sect-head"><h2>单词本</h2><p>${S.vocab.length} 个 · 待掌握 ${todo}</p></div>
    <div class="vtools">

      <button class="tbtn" data-act="vf" data-v="todo" aria-pressed="${S.vf === 'todo'}">待掌握</button>
      <button class="tbtn" data-act="vf" data-v="done" aria-pressed="${S.vf === 'done'}">已掌握</button>
      <select id="vaSel" aria-label="按文章筛选"><option value="all">全部文章</option>${arts.map(id => { const a = S.articles.find(x => x.id === id); const t = a ? a.title : (S.vocab.find(v => v.art === id) || {}).title; return `<option value="${esc(id)}" ${S.va === id ? 'selected' : ''}>${esc(t || id)}</option>`; }).join('')}</select>
      <button class="tbtn" data-act="toggle" data-k="hideZh" aria-pressed="${S.hideZh}">遮住释义自测</button>
    </div>`;
  if (!S.vocab.length) return head + `<div class="empty"><h2>还没有生词</h2><p>在精读页点任意单词，选“加入单词本”。每个词都会记住它出自哪一句，之后可以一键回到原文。</p></div>`;
  if (!list.length) return head + `<p class="p-miss">这个筛选下没有单词。</p>`;
  return head + `<div class="vgrid">${list.map(v => {
    const blur = S.hideZh && !S.vshow.has(v.id);
    const ctx = esc(v.ctx || '').replace(new RegExp(`\\b(${esc(v.w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+')})\\b`, 'i'), '<mark>$1</mark>');
    return `<article class="vitem${v.done ? ' done' : ''}">
      <div class="vhead"><b>${esc(v.w)}</b>${v.ph ? `<span class="vipa">/${esc(v.ph)}/</span>` : ''}<span class="chip ${posClass(v.pos)}">${esc(v.pos)}</span>${speakBtn(v.w)}</div>
      <p class="vzh${blur ? ' blur' : ''}" ${blur ? `data-act="vreveal" data-id="${esc(v.id)}" title="点按显示"` : ''}>${esc(v.zh)}</p>
      ${v.en && !blur ? `<p class="ven">${esc(v.en)}</p>` : ''}
      ${v.ctx ? `<p class="vctx">${ctx}</p>` : ''}
      <div class="vsrc">《${esc(v.title || '')}》 ¶${(v.p ?? 0) + 1} · ${v.at ? dateCN(v.at) : ''}</div>
      <div class="vact"><button class="pbtn" data-act="goto" data-id="${esc(v.id)}">回到原句</button>
      <button class="pbtn ghost" data-act="vdone" data-id="${esc(v.id)}">${v.done ? '标为待掌握' : '我记住了'}</button>
      <button class="pbtn ghost" data-act="vdel" data-id="${esc(v.id)}">删除</button></div>
    </article>`;
  }).join('')}</div>`;
}
function vocabId(art, w){ return (art + '~' + w).replace(/[^A-Za-z0-9_\-.~:@+]/g, '_').slice(0, 180); }
function toggleVocab(a, entry){
  const have = vocabHas(a.id, entry.w);
  if (have) {
    S.vocab = S.vocab.filter(v => v !== have);
    write('vocab/' + have.id, ref => ref.delete());
    toast(`已从单词本移除 ${entry.w}`);
  } else {
    const id = vocabId(a.id, entry.w);
    const doc = { w: entry.w, pos: entry.pos, zh: entry.zh, ph: entry.ph || '', en: entry.en || '', art: a.id, title: a.title, p: entry.p, s: entry.s, ctx: entry.p != null ? plainSent(a, entry.p, entry.s) : '', at: Date.now(), done: false };
    S.vocab = [{ id, ...doc }, ...S.vocab];
    write('vocab/' + id, ref => ref.set(doc));
    toast(`已加入单词本：${entry.w}`);
  }
  renderChrome(); renderPanel();
}

  const near = (a, b) => { if (a === b) return true; if (Math.abs(a.length - b.length) > 1 || a.length < 4) return false;
    let i = 0, j = 0, d = 0; while (i < a.length && j < b.length) { if (a[i] === b[j]) { i++; j++; continue; } if (++d > 1) return false;
      if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; } } return d + (a.length - i) + (b.length - j) <= 1; };
  return keys.map(k => {
    const t = k.t.toLowerCase().trim();
    if (text.includes(t)) return k;
    const ws = t.split(/\s+/);
    for (let s = 0; s + ws.length <= toks.length; s++) if (ws.every((w, x) => near(w, toks[s + x]))) return { ...k, t: toks.slice(s, s + ws.length).join(' ') };
    return null;
  }).filter(Boolean);
}
function normalize(d){
  if (!d || !Array.isArray(d.paragraphs) || !d.paragraphs.length) throw { code: 'invalid_json' };
  const paragraphs = d.paragraphs.map(p => ({ sentences: (p.sentences || []).filter(s => s && s.en).map(s => ({ en: String(s.en).replace(/\{\{\s*(\d+)\s*\}\}/g, '{{$1}}'), zh: String(s.zh || '') })) })).filter(p => p.sentences.length);
  if (!paragraphs.length) throw { code: 'invalid_json' };
  const options = {}; Object.entries(d.options || {}).forEach(([k, v]) => { if (v && v.w) options[k.trim().toUpperCase().slice(0, 1)] = { w: String(v.w), pos: String(v.pos || ''), zh: String(v.zh || ''), en: String(v.en || '') }; });
  const blanks = {}; Object.entries(d.blanks || {}).forEach(([k, v]) => { const n = String(k).replace(/\D/g, ''); if (n && v && v.ans) blanks[n] = { ans: String(v.ans).trim().toUpperCase().slice(0, 1), need: String(v.need || ''), cands: Array.isArray(v.cands) ? v.cands.map(x => String(x).toUpperCase().slice(0, 1)) : [], why: String(v.why || ''), trap: String(v.trap || ''), tip: String(v.tip || '') }; });
  const keys = fixKeys((d.keys || []).filter(k => k && k.t).map(k => ({ t: String(k.t), k: k.k === 'phrase' || /\s/.test(k.t) ? 'phrase' : 'word', n: String(k.n || '') })), paragraphs).slice(0, 20);
  return { title: String(d.title || '未命名文章'), zh: String(d.zh || ''), source: String(d.source || '精读'), paragraphs, options, blanks, keys, tips: (d.tips || []).map(String).slice(0, 6) };
}
async function runImport(){
  const photo = S.impMode === 'photo';
  if (photo && !S.impFiles.length) { setImp({ err: '请先选择照片。' }); return; }
  if (!photo && !S.impForm.impText.trim()) { setImp({ err: '请先粘贴文章正文。' }); return; }
  if (!S.db) { setImp({ err: '存档没有连上，导入的文章无法保存。' }); return; }
  const ctl = new AbortController(); S.impCtl = ctl;
  const t0 = Date.now(), chars = S.impForm.impText.length;
  // rough size of the model's reply, for the progress bar (the seeds run ~5× their input text)
  const expect = photo ? 7000 + 2500 * (S.impFiles.length - 1) : Math.min(22000, Math.max(3500, chars * 5));
  setImp({ busy: true, stage: 1, t0, text: '', expect, chars, photo: photo ? S.impFiles.length : 0 });
  impPaint();
  const tick = setInterval(() => { if (!S.imp || !S.imp.busy) return clearInterval(tick); impPaint(); }, 1000);
  const feed = ({ text }) => { const I = S.imp; if (!I || !I.busy) return; I.text = text; if (I.stage === 1 && text) I.stage = 2; impPaintSoon(); };
  try {
    const opts = { modelTier: 'complex', signal: ctl.signal, onText: feed };
    if (photo) opts.images = S.impFiles.slice();
    const raw = await S.sample.json(importPrompt(S.impForm, photo ? S.impFiles.length : 0), opts);
    const art = normalize(raw);
    const id = (art.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'article') + '-' + Date.now().toString(36);
    const plain = art.paragraphs.map(p => p.sentences.map(s => s.en).join(' ')).join('\n\n');
    const words = [...new Set(plain.replace(/\{\{\d+\}\}/g, ' ').match(/[A-Za-z]+(?:['’][A-Za-z]+)*/g) || [])].map(w => w.toLowerCase());
    const sents = art.paragraphs.reduce((n, p) => n + p.sentences.length, 0), why = Object.values(art.blanks || {}).filter(b => b && b.why).length;
    S.imp = { busy: true, stage: 3, t0, text: '', total: new Set(words).size, tagged: 0, sents, why }; impPaint();
    let lex = {};
    for (let attempt = 0; attempt < 2 && !Object.keys(lex).length; attempt++) {   // tagging is long; one retry if it breaks
      try {
        if (attempt) { S.imp.text = ''; S.imp.retry = true; impPaint(); }
        const L = await S.sample.json(lexPrompt(plain, [...new Set(words)]), { modelTier: 'default', signal: ctl.signal, onText: feed });
        if (L && typeof L === 'object') Object.entries(L).forEach(([k, v]) => { if (Array.isArray(v) && v.length >= 2) lex[k.toLowerCase()] = v[2] ? [String(v[0]), String(v[1]), String(v[2])] : [String(v[0]), String(v[1])]; });
      } catch(e){ if (e && e.code === 'cancelled') throw e; if (['free_used_up', 'busy_today', 'bad_key', 'no_balance'].includes(e && e.code)) break; }
    }
    const doc = { ...art, id, lex, createdAt: Date.now() };
    await S.db.doc('articles/' + id).set(doc);
    S.imp = { busy: true, stage: 4, t0, sents, total: new Set(words).size, title: art.title, tagged: Object.keys(lex).length }; impPaint();
    await new Promise(r => setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 150 : 900));
    S.impForm = { impTitle:'', impText:'', impBank:'', impAns:'' }; S.impFiles = [];
    S.imp = { done: `已加入往期：${art.title}${Object.keys(lex).length ? '' : '（词性标注没完成，点单词时可以单独查）'}` };
    if (!S.articles.find(a => a.id === id)) S.articles = [{ ...doc }, ...S.articles];
    openArticle(id);
    toast('新文章已排版，开始精读吧');
  } catch(e){
    S.imp = { err: sampleErr(e) }; S.impDirty = true; renderView();
  } finally { clearInterval(tick); S.impStopArm = false; impDialog(false); }
}

/* ---------- actions ---------- */
function openArticle(id){
  S.cur = id; S.userChose = true; S.view = 'read'; S.panel = null;
  S.openZh = new Set(); S.unguard = new Set(); S.confirmReset = false;
  const p = progOf(id); p.lastOpened = Date.now(); setProg(id, p);
  render(); window.scrollTo({ top: 0 });
}
function pickDefault(){
  if (!S.articles.length) return null;
  let best = null, t = -1;
  S.articles.forEach(a => { const lo = (S.prog[a.id] || {}).lastOpened || 0; if (lo > t) { t = lo; best = a.id; } });
  return t > 0 ? best : S.articles[0].id;
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200); }
function speak(w){
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = 'en-US'; u.rate = .9; speechSynthesis.speak(u); } catch(e){}
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) {
    const w = e.target.closest('#body .w');
    if (w && Date.now() - S.selAt > 350) {
      const sEl = w.closest('.s'); const kw = w.closest('.kw');
      const lw = w.textContent.toLowerCase(); const le = lexOf(cur(), lw);
      S.panel = { type: 'word', w: lw, disp: w.textContent, p: +sEl.dataset.p, s: +sEl.dataset.s, i: +w.dataset.i, k: kw ? +kw.dataset.k : null };
      S.dictAll = false; loadDict(S.panel, lw, le ? le[0] : '');
      renderPanel();
    }
    return;
  }
  const act = t.dataset.act; const a = cur();
  switch (act) {
    case 'view':
      S.view = t.dataset.v; S.panel = null; S.confirmDel = null;
      if (S.view === 'import') S.impDirty = true;
      render(); window.scrollTo({ top: 0 }); break;
    case 'close': S.panel = null; renderPanel(); break;
    case 'blank': {
      S.panel = { type: 'blank', n: t.dataset.n }; S.hint = false; renderPanel();
      if (!t.closest('#body')) { const b = $(`#body .blank[data-n="${t.dataset.n}"]`); if (b && window.innerWidth >= 1040) b.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
      break;
    }
    case 'pick': {
      const p = progOf(a.id); p.picks[t.dataset.n] = t.dataset.l; delete p.shown[t.dataset.n];
      setProg(a.id, p); renderView(); renderPanel(); break;
    }
    case 'show': { const p = progOf(a.id); p.shown[t.dataset.n] = true; setProg(a.id, p); renderView(); renderPanel(); break; }
    case 'redo': { const p = progOf(a.id); delete p.picks[t.dataset.n]; delete p.shown[t.dataset.n]; setProg(a.id, p); S.hint = false; renderView(); renderPanel(); break; }
    case 'hint': S.hint = !S.hint; renderPanel(); break;
    case 'revealAll': { const p = progOf(a.id); blankNums(a).forEach(n => { if (!st(a, n).done) p.shown[n] = true; }); setProg(a.id, p); renderView(); renderPanel(); break; }
    case 'reset': {
      if (!S.confirmReset) { S.confirmReset = true; renderView(); setTimeout(() => { if (S.confirmReset) { S.confirmReset = false; if (S.view === 'read') renderView(); } }, 3500); break; }
      S.confirmReset = false; const p = progOf(a.id); p.picks = {}; p.shown = {}; setProg(a.id, p); S.unguard = new Set(); S.panel = null; renderView(); renderPanel(); toast('已清空本篇作答'); break;
    }
    case 'opt': { const o = a.options[t.dataset.l]; S.panel = { type: 'opt', l: t.dataset.l }; S.dictAll = false; if (o) loadDict(S.panel, o.w, o.pos); renderPanel(); break; }
    case 'dictmore': S.dictAll = !S.dictAll; renderPanel(true); break;
    case 'detail': case 'detailretry': { const P = S.panel; if (!P) break; P.showDetail = true; loadMore(P); renderPanel(true); break; }
    case 'look': {
      const prev = S.panel; const w = t.dataset.w;
      S.panel = { type: 'dict', w: w.toLowerCase(), disp: w, back: prev, pos: '', showDetail: false };
      S.dictAll = false; loadDict(S.panel, w.toLowerCase(), ''); renderPanel(); break;
    }
    case 'back': if (S.panel && S.panel.back) { S.panel = S.panel.back; renderPanel(); } break;
    case 'ainote': aiNote(S.panel); break;
    case 'savedict': {
      const P = S.panel; if (!P || !P.dict || P.dict.state !== 'ok') break;
      const tl = trLines(P.dict.res.e.t)[0];
      toggleVocab(a, { w: P.w, pos: tl ? (tl.tp || '—') : '—', zh: tl ? tl.text : '', p: null, s: null, ...dictExtras(P) }); break;
    }
    case 'dictretry': if (S.panel && S.panel.lw) { loadDict(S.panel, S.panel.lw, S.panel.pos); renderPanel(true); } break;
    case 'ptr': { const p = +t.dataset.p; S.openZh.has(p) ? S.openZh.delete(p) : S.openZh.add(p); if (S.zhAll && !S.openZh.has(p)) S.zhAll = false; renderView(); highlight(); break; }
    case 'unguard': S.unguard.add(t.dataset.k); if (S.view === 'read') { renderView(); renderPanel(); } break;
    case 'toggle': { const k = t.dataset.k; S[k] = !S[k]; if (k !== 'zhAll') LS.set(k, S[k]); if (k === 'zhAll' && !S.zhAll) S.openZh = new Set(); renderView(); highlight(); break; }
    case 'save': {
      const P = S.panel; const e2 = lexOf(a, P.w); if (!e2) break;
      toggleVocab(a, { w: P.w, pos: e2[0], zh: e2[1], p: P.p, s: P.s, ...dictExtras(P) }); break;
    }
    case 'savekw': { const P = S.panel; const kw = a.keys[P.k]; toggleVocab(a, { w: kw.t, pos: 'phrase', zh: kw.n, p: P.p, s: P.s }); break; }
    case 'saveopt': {
      const o = a.options[t.dataset.l]; let ps = [null, null];
      blankNums(a).forEach(n => { if (a.blanks[n].ans === t.dataset.l) ps = locate(a, n); });
      toggleVocab(a, { w: o.w, pos: o.pos, zh: o.zh, p: ps[0], s: ps[1], ...(S.panel && S.panel.type === 'opt' && S.panel.l === t.dataset.l ? dictExtras(S.panel) : {}) }); break;
    }
    case 'speak': speak(t.dataset.w); break;
    case 'lookup': lookup(a, S.panel, t); break;
    case 'open': openArticle(t.dataset.id); break;
    case 'delart': {
      const id = t.dataset.id;
      if (S.confirmDel !== id) { S.confirmDel = id; renderView(); break; }
      S.confirmDel = null; S.articles = S.articles.filter(x => x.id !== id);
      write('articles/' + id, ref => ref.delete()); write('progress/' + id, ref => ref.delete());
      if (S.cur === id) S.cur = pickDefault();
      render(); toast('已删除这篇文章（单词本里的词保留）'); break;
    }
    case 'vf': S.vf = t.dataset.v; renderView(); break;
    case 'vreveal': S.vshow.add(t.dataset.id); renderView(); break;
    case 'vdone': { const v = S.vocab.find(x => x.id === t.dataset.id); if (!v) break; const nd = !v.done; S.vocab = S.vocab.map(x => x === v ? { ...x, done: nd } : x); write('vocab/' + v.id, ref => ref.update({ done: nd })); renderView(); break; }
    case 'vdel': { const v = S.vocab.find(x => x.id === t.dataset.id); if (!v) break; S.vocab = S.vocab.filter(x => x !== v); write('vocab/' + v.id, ref => ref.delete()); renderChrome(); renderView(); toast(`已删除 ${v.w}`); break; }
    case 'goto': gotoVocab(t.dataset.id); break;
    case 'impmode': S.impMode = t.dataset.m; S.imp = null; S.impDirty = true; renderView(); break;
    case 'impgo': runImport(); break;
    case 'impstop': if (S.impCtl) S.impCtl.abort(); break;
  }
});
function gotoVocab(id){
  const v = S.vocab.find(x => x.id === id); if (!v) return;
  const a = S.articles.find(x => x.id === v.art);
  if (!a) { toast('原文已被删除'); return; }
  if (S.cur !== a.id) openArticle(a.id); else { S.view = 'read'; render(); }
  if (v.p == null) { const l = Object.keys(a.options || {}).find(x => a.options[x].w === v.w); S.panel = { type: 'opt', l }; if (l) loadDict(S.panel, v.w, a.options[l].pos); renderPanel(); return; }
  const single = !/\s/.test(v.w) && v.pos !== 'phrase';
  S.panel = single ? { type: 'word', w: v.w.toLowerCase(), disp: v.w, p: v.p, s: v.s, i: null, k: null } : { type: 'sent', list: [[v.p, v.s]] };
  S.dictAll = false; if (single) loadDict(S.panel, v.w.toLowerCase(), v.pos);
  renderPanel();
  const sEl = $(`#body .s[data-p="${v.p}"][data-s="${v.s}"]`);
  if (sEl) {
    if (single) $$('.w', sEl).filter(w => w.textContent.toLowerCase() === v.w.toLowerCase()).forEach(w => w.classList.add('on'));
    requestAnimationFrame(() => { sEl.scrollIntoView({ block: 'center', behavior: 'smooth' }); sEl.classList.remove('flash'); void sEl.offsetWidth; sEl.classList.add('flash'); });
  }
}
async function lookup(a, P, btn){
  if (!S.sample || !P) return;
  btn.disabled = true; btn.textContent = '正在查…';
  try {
    const res = await S.sample.json(`英文句子："${plainSent(a, P.p, P.s)}"\n请给出单词 "${P.disp}" 在这句话中的词性和简明中文释义。只输出 JSON 数组 ["词性", "中文释义", "这句话里的简短英文释义"]，词性用 n. v. adj. adv. prep. conj. pron. 等缩写，变化形式写在括号里，如 "v.（过去式）"。`, { modelTier: 'quick' });
    if (!Array.isArray(res) || res.length < 2) throw { code: 'invalid_json' };
    const entry = res[2] ? [String(res[0]), String(res[1]), String(res[2])] : [String(res[0]), String(res[1])];
    const idx = S.articles.findIndex(x => x.id === a.id);
    if (idx >= 0) S.articles[idx] = { ...S.articles[idx], lex: { ...(S.articles[idx].lex || {}), [P.w]: entry } };
    write('articles/' + a.id, ref => ref.update({ lex: { [P.w]: entry } }));
    renderView(); renderPanel();
  } catch(e){ btn.disabled = false; btn.textContent = '让 Claude 按语境释义'; toast(sampleErr(e)); }
}
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id in S.impForm) S.impForm[id] = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.id === 'vaSel') { S.va = e.target.value; renderView(); }
  if (e.target.id === 'impFile') {
    impAdd(e.target);
  }
});
function onSelect(){
  const sel = getSelection(); if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  const body = $('#body'); if (!body) return;
  const r = sel.getRangeAt(0); if (!body.contains(r.commonAncestorContainer)) return;
  if (sel.toString().trim().length < 2) return;
  const list = $$('.s', body).filter(el => r.intersectsNode(el)).map(el => [+el.dataset.p, +el.dataset.s]);
  if (!list.length) return;
  S.selAt = Date.now(); S.panel = { type: 'sent', list }; renderPanel();
}
document.addEventListener('mouseup', () => setTimeout(onSelect, 10));
document.addEventListener('touchend', () => setTimeout(onSelect, 120));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.panel) { S.panel = null; renderPanel(); } });

/* ---------- bottom sheet drag (phones / narrow windows) ---------- */
(() => {
  const el = $('#panel');
  let st = null, lastTouch = 0;
  const isSheet = () => window.innerWidth < 1040 && el.classList.contains('open');
  const begin = (y, fromGrab) => ({ y0: y, h0: el.getBoundingClientRect().height, fromGrab, dragging: false, lastY: y, lastT: performance.now(), v: 0 });
  function move(y, ev){
    if (!st) return;
    const dy = y - st.y0;
    if (!st.dragging) {
      if (st.fromGrab) { if (Math.abs(dy) < 4) return; }
      else if (!(el.scrollTop <= 0 && dy > 6)) { if (Math.abs(dy) > 6) st = null; return; }
      st.dragging = true; el.classList.add('dragging');
    }
    if (ev && ev.cancelable) ev.preventDefault();
    const now = performance.now();
    st.v = (y - st.lastY) / Math.max(1, now - st.lastT); st.lastY = y; st.lastT = now;
    const H = window.innerHeight;
    el.style.height = Math.max(60, Math.min(H * 0.95, st.h0 - dy)) + 'px';
  }
  function end(){
    if (!st) return;
    const s = st; st = null;
    if (!s.dragging) {
      if (s.fromGrab) { S.sheet = S.sheet === 'full' ? 'half' : 'full'; el.classList.toggle('full', S.sheet === 'full'); }
      return;
    }
    const H = window.innerHeight, half = H * 0.62, full = H * 0.92;
    const h = el.getBoundingClientRect().height;
    let target;
    if (s.v > 0.5) target = s.h0 > (half + full) / 2 && h > half * 0.7 ? 'half' : 'close';
    else if (s.v < -0.5) target = 'full';
    else target = h < half * 0.6 ? 'close' : h < (half + full) / 2 ? 'half' : 'full';
    el.classList.remove('dragging');
    void el.offsetHeight;
    if (target === 'close') {
      S.panel = null; S.sheet = 'half';
      el.classList.remove('open', 'full');
      setTimeout(() => { el.style.height = ''; renderPanel(); }, 300);
      highlight();
    } else {
      S.sheet = target;
      el.classList.toggle('full', target === 'full');
      el.style.height = '';
    }
  }
  el.addEventListener('touchstart', e => { lastTouch = Date.now(); if (!isSheet() || e.touches.length !== 1) return; st = begin(e.touches[0].clientY, !!e.target.closest('[data-grab]')); }, { passive: true });
  el.addEventListener('touchmove', e => { if (st) move(e.touches[0].clientY, e); }, { passive: false });
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
  el.addEventListener('mousedown', e => {
    if (!isSheet() || !e.target.closest('[data-grab]') || Date.now() - lastTouch < 800) return;
    st = begin(e.clientY, true); e.preventDefault();
    const mm = ev => move(ev.clientY, ev);
    const mu = () => { window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); end(); };
    window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
  });
})();

/* ---------- boot ---------- */
render();
(async () => {
  const C = window.claude;
  if (!C || typeof C.use !== 'function') { S.dbState = 'none'; render(); return; }
  C.use('sample').then(s => { S.sample = s || null; if (S.view === 'import') { S.impDirty = true; renderView(); } else renderPanel(); }).catch(() => {});
  let db = null;
  try { db = await C.use('db'); } catch(e){ db = null; }
  if (!db) { S.dbState = 'none'; render(); return; }
  S.db = db;
  const settle = () => { if (!S.userChose) S.cur = pickDefault(); };
  db.collection('articles').onSnapshot(snap => {
    S.articles = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
    S.dbState = 'ok';
    if (S.cur && !S.articles.find(a => a.id === S.cur)) S.cur = null;
    if (!S.cur) settle();
    if (S.view !== 'import') render(); else renderChrome();
  }, () => { S.dbState = 'err'; render(); });
  db.collection('progress').onSnapshot(snap => {
    snap.docs.forEach(d => { S.prog[d.id] = d.data(); });
    if (!S.userChose) settle();
    if (S.view === 'read' || S.view === 'archive') { renderChrome(); renderView(); highlight(); }
  }, () => {});
  db.collection('notes').onSnapshot(snap => {
    snap.docs.forEach(d => { const n = d.data(); S.notes[d.id] = n; });
    if (S.view === 'read' && S.panel && S.panel.showDetail) renderPanel(true);
  }, () => {});
  db.collection('vocab').onSnapshot(snap => {
    S.vocab = snap.docs.map(d => ({ ...d.data(), id: d.id })).sort((x, y) => (y.at || 0) - (x.at || 0));
    renderChrome();
    if (S.view === 'vocab' || S.view === 'archive') renderView();
    else if (S.view === 'read') renderPanel();
  }, () => {});
})();
})();
